<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-visual" />

  <!-- Prevent Caching for HTML only (assets use hash-based cache busting) -->
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />

  <!-- PWA & Mobile App Meta -->
  <meta name="theme-color" content="#07111f" media="(prefers-color-scheme: dark)" />
  <meta name="theme-color" content="#07111f" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="ISP Portal" />
  <meta name="application-name" content="ISP Entertainment Portal" />
  <meta name="msapplication-TileColor" content="#07111f" />
  <meta name="msapplication-tap-highlight" content="no" />

  <!-- SEO -->
  <meta name="description"
    content="Speed4You Entertainment Portal — Stream movies, series, and live TV on your local network. Premium Bengali, Hindi, and English content." />
  <meta name="robots" content="index, follow" />
  <meta name="keywords" content="streaming, movies, series, live TV, ISP portal, Bengali movies, local network, entertainment" />
  <link rel="canonical" href="https://data.speed4you.net/portal/" />

  <!-- Open Graph -->
  <meta property="og:type" content="website" />
  <meta property="og:title" content="Speed4You Entertainment Portal" />
  <meta property="og:description" content="Stream movies, series, and live TV. Premium Bengali, Hindi, and English content on your local network." />
  <meta property="og:image" content="/portal/favicon.svg" />
  <meta property="og:url" content="https://data.speed4you.net/portal/" />
  <meta property="og:site_name" content="Speed4You" />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="Speed4You Entertainment Portal" />
  <meta name="twitter:description" content="Stream movies, series, and live TV on your local network." />

  <!-- Favicon & Icons -->
  <link rel="icon" type="image/svg+xml" href="favicon.svg" />
  <link rel="apple-touch-icon" href="favicon.svg" />
  <link rel="manifest" href="manifest.json" />

  <!-- Preconnect for performance -->
  <link rel="preconnect" href="https://fonts.googleapis.com" crossorigin />
  <link rel="preconnect" href="https://image.tmdb.org" />
  <link rel="dns-prefetch" href="https://image.tmdb.org" />

  <!-- Bengali font for better text rendering -->
  <link rel="preload" href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;600;700&display=swap"
    as="style" onload="this.onload=null;this.rel='stylesheet'" />
  <noscript>
    <link rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;600;700&display=swap" />
  </noscript>

  <title>Speed4You Entertainment Portal — Movies, Series & Live TV</title>
</head>

<body>
  <div id="root"></div>
  <script type="module" src="src/main.jsx"></script>
</body>

</html>
