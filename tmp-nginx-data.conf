server {
    listen 80;
    listen [::]:80;
    server_name data.speed4you.net;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/html;
        allow all;
        autoindex off;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name data.speed4you.net;

    ssl_certificate /etc/letsencrypt/live/data.speed4you.net/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/data.speed4you.net/privkey.pem;

    root /var/www/html;
    index index.html index.htm index.php;
    autoindex on;

    # Use Extra_Storage for nginx temp/logs (prevents root disk full)
    access_log /var/www/html/Extra_Storage/nginx-logs/data-access.log;
    error_log /var/www/html/Extra_Storage/nginx-logs/data-error.log;
    proxy_temp_path /var/www/html/Extra_Storage/nginx-tmp/proxy 1 2;

    location /portal-api/ {
        proxy_pass http://127.0.0.1:4100/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /portal/ {
        alias /var/www/html/portal/;
        index index.html;
        try_files $uri $uri/ /portal/index.html;
        autoindex off;
    }

    location / {
        try_files $uri $uri/ =404;
    }

    location ~ \.php$ {
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include fastcgi_params;
    }

    location ~ /\.ht {
        deny all;
    }

    client_max_body_size 100M;
}
