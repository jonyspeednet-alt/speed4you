# Aider config — Speed4You
#
# Aider-specific config. The project's rules live in AGENTS.md (the canonical
# operating manual for every AI agent/model on this repo). This file just
# tells Aider to read AGENTS.md on every run and to never write to state
# files (worklog.md, plan.md, TODO.md) or ***REMOVED***s without confirmation.

# Use the canonical agent manual as the only read-only convention file
read:
  - AGENTS.md

# Conventions file (read-only, treated as "repo map" + "auto-lint")
# Aider will inject this into every prompt
# (the read-only flag in `read:` above means it will not be edited)

# Aider's default model is fine; do not change it without user input.
# model: gpt-4o

# Don't auto-commit — let the user review the diff first
auto-commits: false

# Don't auto-push under any circumstances
auto-push: false

# Don't suggest edits to state files (worklog.md, plan.md, TODO.md)
# or anything under ***REMOVED***s/local/. Aider will still suggest them; just
# confirm with the user before applying (no native config for this;
# AGENTS.md §17 says so).
