name: Deploy ISP Entertainment Portal

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: production-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: self-hosted

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend

      - name: Build frontend
        run: npm run build
        working-directory: frontend
        env:
          VITE_APP_BASE: /portal/

      - name: Record frontend bundle fingerprint
        id: frontend_bundle
        run: |
          set -e
          bundle=$(grep -oE 'index-[a-z0-9]+\.js' frontend/dist/index.html | head -n 1)
          if [ -z "$bundle" ]; then
            echo "Could not find main frontend bundle in frontend/dist/index.html" >&2
            exit 1
          fi
          echo "bundle=$bundle" >> "$GITHUB_OUTPUT"
          echo "Built frontend main bundle: $bundle"

      - name: Install backend dependencies (lockfile only)
        run: npm ci
        working-directory: backend

      - name: Strip node_modules from backend transfer
        run: rm -rf node_modules
        working-directory: backend

      - name: Check server disk space
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ ***REMOVED***s.DEPLOY_HOST }}
          username: ${{ ***REMOVED***s.DEPLOY_USER }}
          key: ${{ ***REMOVED***s.DEPLOY_SSH_KEY }}
          port: ${{ ***REMOVED***s.DEPLOY_PORT }}
          script: |
            echo "=== Disk space ==="
            df -h /var/www/html/ /home/speed4you/ / 2>/dev/null || df -h
            echo "=== Frontend destination ==="
            ls -la /var/www/html/portal/ 2>/dev/null | head -5 || echo "(empty or missing)"
            echo "=== Build output ==="
            ls -la /home/speed4you/actions-runner/_work/speed4you/speed4you/frontend/dist/ 2>/dev/null | head -5 || echo "(empty or missing)"

      - name: Backup production data files
        uses: appleboy/ssh-action@v1.2.0
        env:
          SUDO_PASSWORD: ${{ ***REMOVED***s.SUDO_PASSWORD }}
        with:
          host: ${{ ***REMOVED***s.DEPLOY_HOST }}
          username: ${{ ***REMOVED***s.DEPLOY_USER }}
          key: ${{ ***REMOVED***s.DEPLOY_SSH_KEY }}
          port: ${{ ***REMOVED***s.DEPLOY_PORT }}
          envs: SUDO_PASSWORD
          script: |
            BACKEND=/home/speed4you/portal-app/backend
            BACKUP_DIR=/home/speed4you/portal-deploy-backups/current
            mkdir -p "$BACKUP_DIR"
            if [ -d "$BACKEND" ]; then
              for f in catalog.json scanner-log.json scanner-roots.json scanner-runtime.json scanner-state.json; do
                if [ -f "$BACKEND/src/data/$f" ]; then
                  cp -a "$BACKEND/src/data/$f" "$BACKUP_DIR/$f"
                fi
              done
            fi
            echo "Backup complete"

      - name: Copy frontend to web root
        uses: appleboy/ssh-action@v1.2.0
        env:
          SUDO_PASSWORD: ${{ ***REMOVED***s.SUDO_PASSWORD }}
        with:
          host: ${{ ***REMOVED***s.DEPLOY_HOST }}
          username: ${{ ***REMOVED***s.DEPLOY_USER }}
          key: ${{ ***REMOVED***s.DEPLOY_SSH_KEY }}
          port: ${{ ***REMOVED***s.DEPLOY_PORT }}
          envs: SUDO_PASSWORD
          script: |
            set -e
            SRC=/home/speed4you/actions-runner/_work/speed4you/speed4you/frontend/dist
            DEST=/var/www/html/portal

            # Check disk space - need at least 50 MB free
            available_kb=$(df --output=avail "$DEST" 2>/dev/null | tail -1)
            if [ -n "$available_kb" ] && [ "$available_kb" -lt 51200 ]; then
              echo "ERROR: Low disk space on $DEST ($available_kb KB available)" >&2
              exit 1
            fi

            if [ -d "$SRC" ]; then
              src_count=$(find "$SRC" -type f | wc -l)
              src_size=$(du -sh "$SRC" | cut -f1)
              echo "Source has $src_count files ($src_size)"

              printf '%s\n' "$SUDO_PASSWORD" | sudo -S -p '' mkdir -p "$DEST"
              printf '%s\n' "$SUDO_PASSWORD" | sudo -S -p '' find "$DEST" -mindepth 1 -maxdepth 1 -exec rm -rf {} +
              printf '%s\n' "$SUDO_PASSWORD" | sudo -S -p '' cp -r "$SRC/." "$DEST/"

              # Verify all files were copied correctly
              dest_count=$(find "$DEST" -type f | wc -l)
              dest_size=$(du -sh "$DEST" | cut -f1)
              echo "Destination has $dest_count files ($dest_size)"

              if [ "$dest_count" -lt "$src_count" ]; then
                echo "ERROR: File count mismatch — source $src_count, destination $dest_count" >&2
                printf '%s\n' "$SUDO_PASSWORD" | sudo -S -p '' ls -la "$DEST/assets/" >&2 || true
                exit 1
              fi

              # Check that index.html references a file that exists
              entry_chunk=$(grep -oE 'assets/index-[a-z0-9]+\.js' "$SRC/index.html" | head -1)
              if [ -n "$entry_chunk" ] && [ ! -f "$DEST/$entry_chunk" ]; then
                echo "ERROR: $DEST/$entry_chunk missing after copy" >&2
                exit 1
              fi

              printf '%s\n' "$SUDO_PASSWORD" | sudo -S -p '' chown -R www-data:www-data "$DEST"
              echo "Frontend copied to $DEST ($dest_count files)"
            else
              echo "ERROR: $SRC not found" >&2
              exit 1
            fi

      - name: Copy backend to app directory
        uses: appleboy/ssh-action@v1.2.0
        env:
          SUDO_PASSWORD: ${{ ***REMOVED***s.SUDO_PASSWORD }}
        with:
          host: ${{ ***REMOVED***s.DEPLOY_HOST }}
          username: ${{ ***REMOVED***s.DEPLOY_USER }}
          key: ${{ ***REMOVED***s.DEPLOY_SSH_KEY }}
          port: ${{ ***REMOVED***s.DEPLOY_PORT }}
          envs: SUDO_PASSWORD
          script: |
            SRC=/home/speed4you/actions-runner/_work/speed4you/speed4you/backend
            DEST=/home/speed4you/portal-app/backend
            if [ -d "$SRC" ]; then
              mkdir -p "$DEST"
              cp -a "$SRC/." "$DEST/"
              echo "Backend copied to $DEST"
            else
              echo "ERROR: $SRC not found" >&2
              exit 1
            fi

      - name: Install deps, write .env, restart, health check
        uses: appleboy/ssh-action@v1.2.0
        env:
          TMDB_API_KEY: ${{ ***REMOVED***s.TMDB_API_KEY }}
          JWT_SECRET: ${{ ***REMOVED***s.JWT_SECRET }}
          SUDO_PASSWORD: ${{ ***REMOVED***s.SUDO_PASSWORD }}
          CORS_ALLOWED_ORIGINS: ${{ ***REMOVED***s.CORS_ALLOWED_ORIGINS }}
          PLAYER_CACHE_ROOT: ${{ ***REMOVED***s.PLAYER_CACHE_ROOT }}
          DB_HOST: ${{ ***REMOVED***s.DB_HOST }}
          DB_PORT: ${{ ***REMOVED***s.DB_PORT }}
          DB_NAME: ${{ ***REMOVED***s.DB_NAME }}
          DB_USER: ${{ ***REMOVED***s.DB_USER }}
          DB_PASSWORD: ${{ ***REMOVED***s.DB_PASSWORD }}
          ADMIN_USERNAME: ${{ ***REMOVED***s.ADMIN_USERNAME }}
          ADMIN_PASSWORD_HASH: ${{ ***REMOVED***s.ADMIN_PASSWORD_HASH }}
        with:
          host: ${{ ***REMOVED***s.DEPLOY_HOST }}
          username: ${{ ***REMOVED***s.DEPLOY_USER }}
          key: ${{ ***REMOVED***s.DEPLOY_SSH_KEY }}
          port: ${{ ***REMOVED***s.DEPLOY_PORT }}
          envs: TMDB_API_KEY,JWT_SECRET,SUDO_PASSWORD,CORS_ALLOWED_ORIGINS,PLAYER_CACHE_ROOT,DB_HOST,DB_PORT,DB_NAME,DB_USER,DB_PASSWORD,ADMIN_USERNAME,ADMIN_PASSWORD_HASH
          script: |
            set -e
            BACKEND=/home/speed4you/portal-app/backend
            BACKUP_DIR=/home/speed4you/portal-deploy-backups/current

            # Restore production data files
            for f in catalog.json scanner-log.json scanner-roots.json scanner-runtime.json scanner-state.json; do
              if [ -f "$BACKUP_DIR/$f" ]; then
                cp -a "$BACKUP_DIR/$f" "$BACKEND/src/data/$f" 2>/dev/null || true
              fi
            done

            cd "$BACKEND"
            npm ci --omit=dev

            cat > .env <<EOF
            PORT=4100
            JWT_SECRET=${JWT_SECRET}
            TMDB_API_KEY=${TMDB_API_KEY}
            CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS}
            PLAYER_CACHE_ROOT=${PLAYER_CACHE_ROOT}
            DB_HOST=${DB_HOST}
            DB_PORT=${DB_PORT}
            DB_NAME=${DB_NAME}
            DB_USER=${DB_USER}
            DB_PASSWORD=${DB_PASSWORD}
            FFMPEG_PATH=/usr/bin/ffmpeg
            FFPROBE_PATH=/usr/bin/ffprobe
            ADMIN_USERNAME=${ADMIN_USERNAME}
            ADMIN_PASSWORD_HASH=${ADMIN_PASSWORD_HASH}
            EOF

            echo "Stopping old backend..."
            if [ -f /home/speed4you/portal-app/backend.pid ]; then
              OLD_PID=$(cat /home/speed4you/portal-app/backend.pid 2>/dev/null || true)
              if [ -n "$OLD_PID" ] && kill -0 "$OLD_PID" 2>/dev/null; then
                kill "$OLD_PID" || true
                sleep 2
              fi
            fi

            echo "Restarting service..."
            printf '%s\n' "$SUDO_PASSWORD" | sudo -S -p '' systemctl restart isp-portal.service

            echo "Health check..."
            for i in $(seq 1 30); do
              if curl -fsS http://127.0.0.1:4100/health >/dev/null 2>&1; then
                echo "Health check passed"
                exit 0
              fi
              sleep 2
            done

            echo "Health check failed" >&2
            exit 1

      - name: Configure nginx caching & HTTP/2
        uses: appleboy/ssh-action@v1.2.0
        env:
          SUDO_PASSWORD: ${{ ***REMOVED***s.SUDO_PASSWORD }}
        with:
          host: ${{ ***REMOVED***s.DEPLOY_HOST }}
          username: ${{ ***REMOVED***s.DEPLOY_USER }}
          key: ${{ ***REMOVED***s.DEPLOY_SSH_KEY }}
          port: ${{ ***REMOVED***s.DEPLOY_PORT }}
          envs: SUDO_PASSWORD
          script: |
            set -e
            CONF=$(grep -rl "location /portal" /etc/nginx/ 2>/dev/null | head -1 || true)
            if [ -z "$CONF" ]; then
              echo "No nginx config found for /portal — skipping"
              exit 0
            fi
            echo "Found nginx config: $CONF"
            CHANGED=0

            # Remove invalid standalone http2 directive from previous broken runs
            if grep -q '^[[:space:]]*http2 on;' "$CONF"; then
              printf '%s\n' "$SUDO_PASSWORD" | sudo -S -p '' sed -i '/^[[:space:]]*http2 on;/d' "$CONF"
              echo "Removed invalid standalone http2 on; directive"
              CHANGED=1
            fi

            # Enable HTTP/2 — must be part of listen directive (nginx 1.25+)
            if ! grep -q 'listen 443 ssl http2' "$CONF"; then
              if grep -q 'listen 443 ssl;' "$CONF"; then
                printf '%s\n' "$SUDO_PASSWORD" | sudo -S -p '' sed -i 's/listen 443 ssl;/listen 443 ssl http2;/' "$CONF"
                echo "HTTP/2 enabled (via listen directive)"
                CHANGED=1
              fi
            fi

            # Enable gzip for text assets if missing
            if ! grep -q 'gzip on' "$CONF"; then
              printf '%s\n' "$SUDO_PASSWORD" | sudo -S -p '' sed -i '/^server {/a\    gzip on;\n    gzip_types text/plain text/css application/json application/javascript image/svg+xml;\n    gzip_min_length 1000;\n    gzip_vary on;' "$CONF"
              echo "gzip enabled"
              CHANGED=1
            fi

            # Add cache & no-cache headers if not already present
            if ! grep -q '/portal/assets/.*expires' "$CONF"; then
              printf '%s\n' "$SUDO_PASSWORD" | sudo -S -p '' sed -i '/^server {/a\
                # Cache portal static assets (hash-based URLs are immutable)\
                location ~ ^/portal/assets/ {\
                    expires 1y;\
                    add_header Cache-Control "public, immutable";\
                    add_header Vary "Accept-Encoding";\
                }\
            \
                # Never cache portal index.html — so new deploys bust chunk URLs\
                location = /portal/index.html {\
                    expires -1;\
                    add_header Cache-Control "no-cache, no-store, must-revalidate";\
                }' "$CONF"
              echo "Cache headers added (assets 1y, index.html no-cache)"
              CHANGED=1
            else
              echo "Cache headers already present"
            fi

            if [ "$CHANGED" = "1" ]; then
              printf '%s\n' "$SUDO_PASSWORD" | sudo -S -p '' nginx -t
              printf '%s\n' "$SUDO_PASSWORD" | sudo -S -p '' systemctl reload nginx
              echo "Nginx reloaded with HTTP/2 + caching"
            else
              echo "Nginx already configured — no changes needed"
            fi

      - name: Verify public frontend bundle
        env:
          EXPECTED_BUNDLE: ${{ steps.frontend_bundle.outputs.bundle }}
        run: |
          set -e
          echo "Expected public bundle: $EXPECTED_BUNDLE"
          url="https://data.speed4you.net/portal/?dv=${{ github.run_id }}"

          # Fetch the public index.html and extract the entry chunk hash
          html=$(curl -fsSL -H 'Cache-Control: no-cache' -H 'Pragma: no-cache' "$url")
          public_bundle=$(printf '%s' "$html" | grep -oE 'index-[a-z0-9]+\.js' | head -n 1 || true)
          echo "Public bundle: $public_bundle"

          if [ "$public_bundle" != "$EXPECTED_BUNDLE" ]; then
            echo "FAIL: Public HTML references $public_bundle, expected $EXPECTED_BUNDLE" >&2
            echo "This means the server is serving stale index.html." >&2
            echo "Check deploy copy (disk space?), nginx root/alias, and any CDN/proxy cache." >&2
            exit 1
          fi

          # Verify the entry chunk actually loads as JavaScript, not HTML
          chunk_url="https://data.speed4you.net/portal/assets/${public_bundle}?dv=${{ github.run_id }}"
          content_type=$(curl -fsSL -o /dev/null -w '%{content_type}' -H 'Cache-Control: no-cache' "$chunk_url")
          echo "Entry chunk Content-Type: $content_type"
          if [ "$content_type" != "application/javascript" ]; then
            echo "FAIL: Entry chunk is not JavaScript (Content-Type: $content_type)" >&2
            echo "Nginx is serving index.html for asset URLs — check try_files config." >&2
            exit 1
          fi

          # Verify cache headers on JS assets
          cache_headers=$(curl -fsSL -I "https://data.speed4you.net/portal/assets/react-vendor-c37b7f41.js?dv=${{ github.run_id }}" 2>&1 | grep -iE 'cache-control|expires')
          echo "Asset cache headers:"
          echo "$cache_headers"
          echo "$cache_headers" | grep -qi 'immutable' || echo "WARNING: Asset cache headers missing"

      - name: Deployment summary
        run: |
          echo "Deployment completed."
          echo "Public site: https://data.speed4you.net/portal"
          echo "API check: https://data.speed4you.net/portal-api/api/content/latest?limit=3"
