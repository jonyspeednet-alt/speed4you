name: Deploy ISP Entertainment Portal

on:
  push:
    branches:
      - main
  workflow_dispatch:


jobs:
  deploy:
    runs-on: self-hosted

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend

      - name: Build frontend for /portal/ (data.speed4you.net)
        run: |
          npm run build
          mv dist dist-portal
        working-directory: frontend
        env:
          VITE_APP_BASE: /portal/

      - name: Build frontend for / (speed4you.net)
        run: npm run build
        working-directory: frontend
        env:
          VITE_APP_BASE: /

      - name: Record frontend bundle fingerprints
        id: frontend_bundle
        run: |
          set -e
          bundle=$(grep -oE 'index-[a-z0-9]+\.js' frontend/dist/index.html | head -n 1)
          portal_bundle=$(grep -oE 'index-[a-z0-9]+\.js' frontend/dist-portal/index.html | head -n 1)
          if [ -z "$bundle" ]; then
            echo "Could not find main frontend bundle in frontend/dist/index.html" >&2
            exit 1
          fi
          echo "bundle=$bundle" >> "$GITHUB_OUTPUT"
          echo "portal_bundle=$portal_bundle" >> "$GITHUB_OUTPUT"
          echo "speed4you bundle: $bundle"
          echo "portal   bundle: $portal_bundle"

      - name: Install backend dependencies (lockfile only)
        run: npm ci
        working-directory: backend

      - name: Strip node_modules from backend transfer
        run: rm -rf node_modules
        working-directory: backend

      - name: Check server disk space
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ ***REMOVED***s.DEPLOY_HOST }}
          username: ${{ ***REMOVED***s.DEPLOY_USER }}
          key: ${{ ***REMOVED***s.DEPLOY_SSH_KEY }}
          port: ${{ ***REMOVED***s.DEPLOY_PORT }}
          script: |
            echo "=== Disk space ==="
            df -h /var/www/html/ /home/speed4you/ / 2>/dev/null || df -h
            echo "=== Frontend destination ==="
            ls -la /var/www/html/portal/ 2>/dev/null | head -5 || echo "(empty or missing)"
            echo "=== Build output ==="
            ls -la /home/speed4you/actions-runner/_work/speed4you/speed4you/frontend/dist/ 2>/dev/null | head -5 || echo "(empty or missing)"

      - name: Backup production data files
        uses: appleboy/ssh-action@v1.2.0
        env:
          SUDO_PASSWORD: ${{ ***REMOVED***s.SUDO_PASSWORD }}
        with:
          host: ${{ ***REMOVED***s.DEPLOY_HOST }}
          username: ${{ ***REMOVED***s.DEPLOY_USER }}
          key: ${{ ***REMOVED***s.DEPLOY_SSH_KEY }}
          port: ${{ ***REMOVED***s.DEPLOY_PORT }}
          envs: SUDO_PASSWORD
          script: |
            BACKEND=/home/speed4you/portal-app/backend
            BACKUP_DIR=/home/speed4you/portal-deploy-backups/current
            mkdir -p "$BACKUP_DIR"
            if [ -d "$BACKEND" ]; then
              for f in catalog.json scanner-log.json scanner-roots.json scanner-runtime.json scanner-state.json; do
                if [ -f "$BACKEND/src/data/$f" ]; then
                  cp -a "$BACKEND/src/data/$f" "$BACKUP_DIR/$f"
                fi
              done
            fi
            echo "Backup complete"

      - name: Copy frontend to web roots
        uses: appleboy/ssh-action@v1.2.0
        env:
          SUDO_PASSWORD: ${{ ***REMOVED***s.SUDO_PASSWORD }}
        with:
          host: ${{ ***REMOVED***s.DEPLOY_HOST }}
          username: ${{ ***REMOVED***s.DEPLOY_USER }}
          key: ${{ ***REMOVED***s.DEPLOY_SSH_KEY }}
          port: ${{ ***REMOVED***s.DEPLOY_PORT }}
          envs: SUDO_PASSWORD
          script: |
            set -e
            BASE=/home/speed4you/actions-runner/_work/speed4you/speed4you/frontend

            deploy_build() {
              local SRC="$1"
              local DEST="$2"
              local NAME="$3"

              available_kb=$(df --output=avail "$DEST" 2>/dev/null | tail -1)
              if [ -n "$available_kb" ] && [ "$available_kb" -lt 51200 ]; then
                echo "ERROR: Low disk space on $DEST ($available_kb KB available)" >&2
                exit 1
              fi

              if [ -d "$SRC" ]; then
                src_count=$(find "$SRC" -type f | wc -l)
                src_size=$(du -sh "$SRC" | cut -f1)
                echo "[$NAME] Source has $src_count files ($src_size)"

                printf '%s\n' "$SUDO_PASSWORD" | sudo -S -p '' mkdir -p "$DEST"
                printf '%s\n' "$SUDO_PASSWORD" | sudo -S -p '' find "$DEST" -mindepth 1 -maxdepth 1 -exec rm -rf {} +
                printf '%s\n' "$SUDO_PASSWORD" | sudo -S -p '' cp -r "$SRC/." "$DEST/"

                dest_count=$(find "$DEST" -type f | wc -l)
                dest_size=$(du -sh "$DEST" | cut -f1)
                echo "[$NAME] Destination has $dest_count files ($dest_size)"

                if [ "$dest_count" -lt "$src_count" ]; then
                  echo "ERROR: [$NAME] File count mismatch" >&2
                  exit 1
                fi

                entry_chunk=$(grep -oE 'assets/index-[a-z0-9]+\.js' "$SRC/index.html" | head -1)
                if [ -n "$entry_chunk" ] && [ ! -f "$DEST/$entry_chunk" ]; then
                  echo "ERROR: [$NAME] $DEST/$entry_chunk missing" >&2
                  exit 1
                fi

                printf '%s\n' "$SUDO_PASSWORD" | sudo -S -p '' chown -R www-data:www-data "$DEST"
                echo "[$NAME] Deployed $src_count files to $DEST"
              else
                echo "ERROR: [$NAME] $SRC not found" >&2
                exit 1
              fi
            }

            deploy_build "$BASE/dist-portal" "/var/www/html/portal" "portal"
            deploy_build "$BASE/dist" "/var/www/speed4you.net" "speed4you.net"

      - name: Copy backend to app directory
        uses: appleboy/ssh-action@v1.2.0
        env:
          SUDO_PASSWORD: ${{ ***REMOVED***s.SUDO_PASSWORD }}
        with:
          host: ${{ ***REMOVED***s.DEPLOY_HOST }}
          username: ${{ ***REMOVED***s.DEPLOY_USER }}
          key: ${{ ***REMOVED***s.DEPLOY_SSH_KEY }}
          port: ${{ ***REMOVED***s.DEPLOY_PORT }}
          envs: SUDO_PASSWORD
          script: |
            SRC=/home/speed4you/actions-runner/_work/speed4you/speed4you/backend
            DEST=/home/speed4you/portal-app/backend
            if [ -d "$SRC" ]; then
              mkdir -p "$DEST"
              cp -a "$SRC/." "$DEST/"
              echo "Backend copied to $DEST"
            else
              echo "ERROR: $SRC not found" >&2
              exit 1
            fi

      - name: Install deps, write .env, restart, health check
        uses: appleboy/ssh-action@v1.2.0
        env:
          TMDB_API_KEY: ${{ ***REMOVED***s.TMDB_API_KEY }}
          JWT_SECRET: ${{ ***REMOVED***s.JWT_SECRET }}
          SUDO_PASSWORD: ${{ ***REMOVED***s.SUDO_PASSWORD }}
          CORS_ALLOWED_ORIGINS: ${{ ***REMOVED***s.CORS_ALLOWED_ORIGINS }}
          PLAYER_CACHE_ROOT: ${{ ***REMOVED***s.PLAYER_CACHE_ROOT }}
          DB_HOST: ${{ ***REMOVED***s.DB_HOST }}
          DB_PORT: ${{ ***REMOVED***s.DB_PORT }}
          DB_NAME: ${{ ***REMOVED***s.DB_NAME }}
          DB_USER: ${{ ***REMOVED***s.DB_USER }}
          DB_PASSWORD: ${{ ***REMOVED***s.DB_PASSWORD }}
          ADMIN_USERNAME: ${{ ***REMOVED***s.ADMIN_USERNAME }}
          ADMIN_PASSWORD_HASH: ${{ ***REMOVED***s.ADMIN_PASSWORD_HASH }}
        with:
          host: ${{ ***REMOVED***s.DEPLOY_HOST }}
          username: ${{ ***REMOVED***s.DEPLOY_USER }}
          key: ${{ ***REMOVED***s.DEPLOY_SSH_KEY }}
          port: ${{ ***REMOVED***s.DEPLOY_PORT }}
          envs: TMDB_API_KEY,JWT_SECRET,SUDO_PASSWORD,CORS_ALLOWED_ORIGINS,PLAYER_CACHE_ROOT,DB_HOST,DB_PORT,DB_NAME,DB_USER,DB_PASSWORD,ADMIN_USERNAME,ADMIN_PASSWORD_HASH
          script: |
            set -e
            BACKEND=/home/speed4you/portal-app/backend
            BACKUP_DIR=/home/speed4you/portal-deploy-backups/current

            # Restore production data files
            for f in catalog.json scanner-log.json scanner-roots.json scanner-runtime.json scanner-state.json; do
              if [ -f "$BACKUP_DIR/$f" ]; then
                cp -a "$BACKUP_DIR/$f" "$BACKEND/src/data/$f" 2>/dev/null || true
              fi
            done

            cd "$BACKEND"
            npm ci --omit=dev

            # Ensure IP-based access is always allowed in CORS
            CORS="${CORS_ALLOWED_ORIGINS}"
            if [[ "$CORS" != *"103.79.182.226"* ]]; then
              CORS="${CORS},https://103.79.182.226"
            fi

            cat > .env <<EOF
            PORT=4100
            JWT_SECRET=${JWT_SECRET}
            TMDB_API_KEY=${TMDB_API_KEY}
            CORS_ALLOWED_ORIGINS=${CORS}
            PLAYER_CACHE_ROOT=${PLAYER_CACHE_ROOT}
            DB_HOST=${DB_HOST}
            DB_PORT=${DB_PORT}
            DB_NAME=${DB_NAME}
            DB_USER=${DB_USER}
            DB_PASSWORD=${DB_PASSWORD}
            FFMPEG_PATH=/usr/bin/ffmpeg
            FFPROBE_PATH=/usr/bin/ffprobe
            ADMIN_USERNAME=${ADMIN_USERNAME}
            ADMIN_PASSWORD_HASH=${ADMIN_PASSWORD_HASH}
            EOF

            echo "Stopping old backend..."
            if [ -f /home/speed4you/portal-app/backend.pid ]; then
              OLD_PID=$(cat /home/speed4you/portal-app/backend.pid 2>/dev/null || true)
              if [ -n "$OLD_PID" ] && kill -0 "$OLD_PID" 2>/dev/null; then
                kill "$OLD_PID" || true
                sleep 2
              fi
            fi

            echo "Restarting service..."
            printf '%s\n' "$SUDO_PASSWORD" | sudo -S -p '' systemctl restart isp-portal.service

            echo "Health check..."
            for i in $(seq 1 30); do
              if curl -fsS http://127.0.0.1:4100/health >/dev/null 2>&1; then
                echo "Health check passed"
                exit 0
              fi
              sleep 2
            done

            echo "Health check failed" >&2
            exit 1

      - name: Configure nginx caching & HTTP/2
        uses: appleboy/ssh-action@v1.2.0
        env:
          SUDO_PASSWORD: ${{ ***REMOVED***s.SUDO_PASSWORD }}
        with:
          host: ${{ ***REMOVED***s.DEPLOY_HOST }}
          username: ${{ ***REMOVED***s.DEPLOY_USER }}
          key: ${{ ***REMOVED***s.DEPLOY_SSH_KEY }}
          port: ${{ ***REMOVED***s.DEPLOY_PORT }}
          envs: SUDO_PASSWORD
          script: |
            set -e
            CONF=$(grep -rl "location /portal" /etc/nginx/ 2>/dev/null | head -1 || true)
            if [ -z "$CONF" ]; then
              echo "No nginx config found for /portal — skipping"
              exit 0
            fi
            echo "Found nginx config: $CONF"

            # Remove all lines previously added by this deploy script, so we start clean
            printf '%s\n' "$SUDO_PASSWORD" | sudo -S -p '' sed -i '/^    gzip on;/d' "$CONF"
            printf '%s\n' "$SUDO_PASSWORD" | sudo -S -p '' sed -i '/^    gzip_types/d' "$CONF"
            printf '%s\n' "$SUDO_PASSWORD" | sudo -S -p '' sed -i '/^    gzip_min_length/d' "$CONF"
            printf '%s\n' "$SUDO_PASSWORD" | sudo -S -p '' sed -i '/^    gzip_vary on;/d' "$CONF"
            printf '%s\n' "$SUDO_PASSWORD" | sudo -S -p '' sed -i '/cache-marker/d' "$CONF"
            printf '%s\n' "$SUDO_PASSWORD" | sudo -S -p '' sed -i '/portal-cache/d' "$CONF"
            printf '%s\n' "$SUDO_PASSWORD" | sudo -S -p '' sed -i '/CACHE-MARKER/d' "$CONF"
            printf '%s\n' "$SUDO_PASSWORD" | sudo -S -p '' sed -i '/do not remove/d' "$CONF"

            # Remove invalid standalone http2 directive
            if grep -q '^[[:space:]]*http2 on;' "$CONF"; then
              printf '%s\n' "$SUDO_PASSWORD" | sudo -S -p '' sed -i '/^[[:space:]]*http2 on;/d' "$CONF"
              echo "Removed invalid standalone http2 on;"
            fi

            # Enable HTTP/2
            if ! grep -q 'listen 443 ssl http2' "$CONF"; then
              if grep -q 'listen 443 ssl;' "$CONF"; then
                printf '%s\n' "$SUDO_PASSWORD" | sudo -S -p '' sed -i 's/listen 443 ssl;/listen 443 ssl http2;/' "$CONF"
                echo "HTTP/2 enabled"
              fi
            fi

            # Enable gzip
            if ! grep -q 'gzip on;' "$CONF"; then
              printf '%s\n' "$SUDO_PASSWORD" | sudo -S -p '' sed -i '/^server {/a\    gzip on;\n    gzip_types text/plain text/css application/json application/javascript image/svg+xml;\n    gzip_min_length 1000;\n    gzip_vary on;' "$CONF"
              echo "gzip enabled"
            fi

            # Write cache snippet file (always idempotent) — printf avoids YAML heredoc-indent clash
            printf 'location ~ ^/portal/assets/ {\n    expires 1y;\n    add_header Cache-Control "public, immutable";\n    add_header Vary "Accept-Encoding";\n}\nlocation = /portal/index.html {\n    expires -1;\n    add_header Cache-Control "no-cache, no-store, must-revalidate";\n}\n' > /tmp/portal-cache.conf
            printf '%s\n' "$SUDO_PASSWORD" | sudo -S -p '' cp /tmp/portal-cache.conf /etc/nginx/portal-cache.conf
            echo "Cache snippet written"

            # Add include directive to the /portal location block
            # Handle both "location /portal {" and "location /portal/ {" variants
            if ! grep -q 'include /etc/nginx/portal-cache.conf' "$CONF"; then
              printf '%s\n' "$SUDO_PASSWORD" | sudo -S -p '' sed -i 's|^\([[:space:]]*\)location /portal[[:space:]]*{|\1location /portal {\n\1    include /etc/nginx/portal-cache.conf;|' "$CONF"
              printf '%s\n' "$SUDO_PASSWORD" | sudo -S -p '' sed -i 's|^\([[:space:]]*\)location /portal/[[:space:]]*{|\1location /portal/ {\n\1    include /etc/nginx/portal-cache.conf;|' "$CONF"
              echo "Include directive added to /portal block"
            fi

            # Test and reload
            printf '%s\n' "$SUDO_PASSWORD" | sudo -S -p '' nginx -t
            printf '%s\n' "$SUDO_PASSWORD" | sudo -S -p '' systemctl reload nginx
            echo "Nginx reloaded with HTTP/2 + gzip + caching"

      - name: Verify deployed frontend bundles
        env:
          EXPECTED_BUNDLE: ${{ steps.frontend_bundle.outputs.bundle }}
          EXPECTED_PORTAL_BUNDLE: ${{ steps.frontend_bundle.outputs.portal_bundle }}
        run: |
          set -e
          echo "Expected bundles — speed4you.net: $EXPECTED_BUNDLE, portal: $EXPECTED_PORTAL_BUNDLE"

          verify_dest() {
            local DEST="$1"
            local EXPECTED="$2"
            local NAME="$3"

            if [ ! -f "$DEST/index.html" ]; then
              echo "FAIL [$NAME]: $DEST/index.html not found" >&2
              exit 1
            fi

            local bundle
            bundle=$(grep -oE 'index-[a-z0-9]+\.js' "$DEST/index.html" | head -n 1 || true)
            echo "[$NAME] bundle: $bundle"

            if [ "$bundle" != "$EXPECTED" ]; then
              echo "FAIL [$NAME]: HTML references $bundle, expected $EXPECTED" >&2
              exit 1
            fi

            if [ ! -f "$DEST/assets/$bundle" ]; then
              echo "FAIL [$NAME]: $DEST/assets/$bundle missing" >&2
              exit 1
            fi
            echo "[$NAME] OK — $bundle verified on disk"
          }

          verify_dest "/var/www/speed4you.net" "$EXPECTED_BUNDLE" "speed4you.net"
          verify_dest "/var/www/html/portal" "$EXPECTED_PORTAL_BUNDLE" "portal"

      - name: Deployment summary
        run: |
          echo "Deployment completed."
          echo "speed4you.net : https://speed4you.net/"
          echo "Portal        : https://data.speed4you.net/portal/"
          echo "API check     : https://data.speed4you.net/portal-api/api/content/latest?limit=3"
