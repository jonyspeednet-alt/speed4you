name: Deploy ISP Entertainment Portal

on:
  push:
    branches:
      - main
  workflow_dispatch:


jobs:
  deploy:
    runs-on: self-hosted

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend

      - name: Build frontend
        run: npm run build
        working-directory: frontend
        env:
          VITE_APP_BASE: /

      - name: Record frontend bundle fingerprint
        id: frontend_bundle
        run: |
          set -e
          bundle=$(grep -oE 'index-[a-z0-9]+\.js' frontend/dist/index.html | head -n 1)
          if [ -z "$bundle" ]; then
            echo "Could not find main frontend bundle in frontend/dist/index.html" >&2
            exit 1
          fi
          echo "bundle=$bundle" >> "$GITHUB_OUTPUT"
          echo "Built frontend main bundle: $bundle"

      - name: Install backend dependencies (lockfile only)
        run: npm ci
        working-directory: backend

      - name: Strip node_modules from backend transfer
        run: rm -rf node_modules
        working-directory: backend

      - name: Check server disk space
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ ***REMOVED***s.DEPLOY_HOST }}
          username: ${{ ***REMOVED***s.DEPLOY_USER }}
          key: ${{ ***REMOVED***s.DEPLOY_SSH_KEY }}
          port: ${{ ***REMOVED***s.DEPLOY_PORT }}
          script: |
            echo "=== Disk space ==="
            df -h /var/www/html/ /home/speed4you/ / 2>/dev/null || df -h
            echo "=== Frontend destination ==="
            ls -la /var/www/html/portal/ 2>/dev/null | head -5 || echo "(empty or missing)"
            echo "=== Build output ==="
            ls -la /home/speed4you/actions-runner/_work/speed4you/speed4you/frontend/dist/ 2>/dev/null | head -5 || echo "(empty or missing)"

      - name: Backup production data files
        uses: appleboy/ssh-action@v1.2.0
        env:
          SUDO_PASSWORD: ${{ ***REMOVED***s.SUDO_PASSWORD }}
        with:
          host: ${{ ***REMOVED***s.DEPLOY_HOST }}
          username: ${{ ***REMOVED***s.DEPLOY_USER }}
          key: ${{ ***REMOVED***s.DEPLOY_SSH_KEY }}
          port: ${{ ***REMOVED***s.DEPLOY_PORT }}
          envs: SUDO_PASSWORD
          script: |
            BACKEND=/home/speed4you/portal-app/backend
            BACKUP_DIR=/home/speed4you/portal-deploy-backups/current
            mkdir -p "$BACKUP_DIR"
            if [ -d "$BACKEND" ]; then
              for f in catalog.json scanner-log.json scanner-roots.json scanner-runtime.json scanner-state.json; do
                if [ -f "$BACKEND/src/data/$f" ]; then
                  cp -a "$BACKEND/src/data/$f" "$BACKUP_DIR/$f"
                fi
              done
            fi
            echo "Backup complete"

      - name: Copy frontend to web root
        uses: appleboy/ssh-action@v1.2.0
        env:
          SUDO_PASSWORD: ${{ ***REMOVED***s.SUDO_PASSWORD }}
        with:
          host: ${{ ***REMOVED***s.DEPLOY_HOST }}
          username: ${{ ***REMOVED***s.DEPLOY_USER }}
          key: ${{ ***REMOVED***s.DEPLOY_SSH_KEY }}
          port: ${{ ***REMOVED***s.DEPLOY_PORT }}
          envs: SUDO_PASSWORD
          script: |
            set -e
            SRC=/home/speed4you/actions-runner/_work/speed4you/speed4you/frontend/dist
            DEST=/var/www/speed4you.net

            available_kb=$(df --output=avail "$DEST" 2>/dev/null | tail -1)
            if [ -n "$available_kb" ] && [ "$available_kb" -lt 51200 ]; then
              echo "ERROR: Low disk space on $DEST ($available_kb KB available)" >&2
              exit 1
            fi

            if [ -d "$SRC" ]; then
              src_count=$(find "$SRC" -type f | wc -l)
              src_size=$(du -sh "$SRC" | cut -f1)
              echo "Source has $src_count files ($src_size)"

              printf '%s\n' "$SUDO_PASSWORD" | sudo -S -p '' mkdir -p "$DEST"
              printf '%s\n' "$SUDO_PASSWORD" | sudo -S -p '' find "$DEST" -mindepth 1 -maxdepth 1 -exec rm -rf {} +
              printf '%s\n' "$SUDO_PASSWORD" | sudo -S -p '' cp -r "$SRC/." "$DEST/"

              dest_count=$(find "$DEST" -type f | wc -l)
              dest_size=$(du -sh "$DEST" | cut -f1)
              echo "Destination has $dest_count files ($dest_size)"

              if [ "$dest_count" -lt "$src_count" ]; then
                echo "ERROR: File count mismatch — source $src_count, destination $dest_count" >&2
                exit 1
              fi

              entry_chunk=$(grep -oE 'assets/index-[a-z0-9]+\.js' "$SRC/index.html" | head -1)
              if [ -n "$entry_chunk" ] && [ ! -f "$DEST/$entry_chunk" ]; then
                echo "ERROR: $DEST/$entry_chunk missing after copy" >&2
                exit 1
              fi

              printf '%s\n' "$SUDO_PASSWORD" | sudo -S -p '' chown -R www-data:www-data "$DEST"
              echo "Frontend copied to $DEST ($dest_count files)"
            else
              echo "ERROR: $SRC not found" >&2
              exit 1
            fi

      - name: Copy backend to app directory
        uses: appleboy/ssh-action@v1.2.0
        env:
          SUDO_PASSWORD: ${{ ***REMOVED***s.SUDO_PASSWORD }}
        with:
          host: ${{ ***REMOVED***s.DEPLOY_HOST }}
          username: ${{ ***REMOVED***s.DEPLOY_USER }}
          key: ${{ ***REMOVED***s.DEPLOY_SSH_KEY }}
          port: ${{ ***REMOVED***s.DEPLOY_PORT }}
          envs: SUDO_PASSWORD
          script: |
            SRC=/home/speed4you/actions-runner/_work/speed4you/speed4you/backend
            DEST=/home/speed4you/portal-app/backend
            if [ -d "$SRC" ]; then
              mkdir -p "$DEST"
              cp -a "$SRC/." "$DEST/"
              echo "Backend copied to $DEST"
            else
              echo "ERROR: $SRC not found" >&2
              exit 1
            fi
            # Copy disk cleanup script
            if [ -f "$SRC/scripts/cleanup-disk.sh" ]; then
              printf '%s\n' "$SUDO_PASSWORD" | sudo -S -p '' cp "$SRC/scripts/cleanup-disk.sh" /usr/local/bin/cleanup-disk.sh
              printf '%s\n' "$SUDO_PASSWORD" | sudo -S -p '' chmod +x /usr/local/bin/cleanup-disk.sh
              echo "Cleanup script installed"
            fi

      - name: Install deps, write .env, restart, health check
        uses: appleboy/ssh-action@v1.2.0
        env:
          TMDB_API_KEY: ${{ ***REMOVED***s.TMDB_API_KEY }}
          OMDB_API_KEY: ${{ ***REMOVED***s.OMDB_API_KEY }}
          JWT_SECRET: ${{ ***REMOVED***s.JWT_SECRET }}
          SUDO_PASSWORD: ${{ ***REMOVED***s.SUDO_PASSWORD }}
          CORS_ALLOWED_ORIGINS: ${{ ***REMOVED***s.CORS_ALLOWED_ORIGINS }}
          PLAYER_CACHE_ROOT: ${{ ***REMOVED***s.PLAYER_CACHE_ROOT }}
          DB_HOST: ${{ ***REMOVED***s.DB_HOST }}
          DB_PORT: ${{ ***REMOVED***s.DB_PORT }}
          DB_NAME: ${{ ***REMOVED***s.DB_NAME }}
          DB_USER: ${{ ***REMOVED***s.DB_USER }}
          DB_PASSWORD: ${{ ***REMOVED***s.DB_PASSWORD }}
          ADMIN_USERNAME: ${{ ***REMOVED***s.ADMIN_USERNAME }}
          ADMIN_PASSWORD_HASH: ${{ ***REMOVED***s.ADMIN_PASSWORD_HASH }}
        with:
          host: ${{ ***REMOVED***s.DEPLOY_HOST }}
          username: ${{ ***REMOVED***s.DEPLOY_USER }}
          key: ${{ ***REMOVED***s.DEPLOY_SSH_KEY }}
          port: ${{ ***REMOVED***s.DEPLOY_PORT }}
          envs: TMDB_API_KEY,OMDB_API_KEY,JWT_SECRET,SUDO_PASSWORD,CORS_ALLOWED_ORIGINS,PLAYER_CACHE_ROOT,DB_HOST,DB_PORT,DB_NAME,DB_USER,DB_PASSWORD,ADMIN_USERNAME,ADMIN_PASSWORD_HASH
          script: |
            set -e
            BACKEND=/home/speed4you/portal-app/backend
            BACKUP_DIR=/home/speed4you/portal-deploy-backups/current

            # Restore production data files
            for f in catalog.json scanner-log.json scanner-roots.json scanner-runtime.json scanner-state.json; do
              if [ -f "$BACKUP_DIR/$f" ]; then
                cp -a "$BACKUP_DIR/$f" "$BACKEND/src/data/$f" 2>/dev/null || true
              fi
            done

            cd "$BACKEND"
            npm ci --omit=dev

            # Ensure all required origins are always in CORS
            CORS="${CORS_ALLOWED_ORIGINS}"
            if [[ ",$CORS," != *",https://speed4you.net,"* ]]; then
              CORS="${CORS},https://speed4you.net"
            fi
            if [[ ",$CORS," != *",https://data.speed4you.net,"* ]]; then
              CORS="${CORS},https://data.speed4you.net"
            fi
            if [[ ",$CORS," != *",https://103.79.182.226,"* ]]; then
              CORS="${CORS},https://103.79.182.226"
            fi

            # Use OMDB_API_KEY from ***REMOVED***, fallback to hardcoded key if not set (remove once ***REMOVED*** is configured)
            OMDB_KEY="${OMDB_API_KEY:-***REMOVED***}"
            cat > .env <<EOF
            PORT=4100
            JWT_SECRET=${JWT_SECRET}
            TMDB_API_KEY=${TMDB_API_KEY}
            OMDB_API_KEY=${OMDB_KEY}
            CORS_ALLOWED_ORIGINS=${CORS}
            PLAYER_CACHE_ROOT=${PLAYER_CACHE_ROOT}
            DB_HOST=${DB_HOST}
            DB_PORT=${DB_PORT}
            DB_NAME=${DB_NAME}
            DB_USER=${DB_USER}
            DB_PASSWORD=${DB_PASSWORD}
            FFMPEG_PATH=/usr/bin/ffmpeg
            FFPROBE_PATH=/usr/bin/ffprobe
            ADMIN_USERNAME=${ADMIN_USERNAME}
            ADMIN_PASSWORD_HASH=${ADMIN_PASSWORD_HASH}
            EOF

            echo "Stopping old backend..."
            if [ -f /home/speed4you/portal-app/backend.pid ]; then
              OLD_PID=$(cat /home/speed4you/portal-app/backend.pid 2>/dev/null || true)
              if [ -n "$OLD_PID" ] && kill -0 "$OLD_PID" 2>/dev/null; then
                kill "$OLD_PID" || true
                sleep 2
              fi
            fi

            echo "Restarting service..."
            printf '%s\n' "$SUDO_PASSWORD" | sudo -S -p '' systemctl restart isp-portal.service

            echo "Health check..."
            for i in $(seq 1 30); do
              if curl -fsS http://127.0.0.1:4100/health >/dev/null 2>&1; then
                echo "Health check passed"
                exit 0
              fi
              sleep 2
            done

            echo "Health check failed" >&2
            exit 1

      - name: Configure nginx HTTP/2 & gzip
        uses: appleboy/ssh-action@v1.2.0
        env:
          SUDO_PASSWORD: ${{ ***REMOVED***s.SUDO_PASSWORD }}
        with:
          host: ${{ ***REMOVED***s.DEPLOY_HOST }}
          username: ${{ ***REMOVED***s.DEPLOY_USER }}
          key: ${{ ***REMOVED***s.DEPLOY_SSH_KEY }}
          port: ${{ ***REMOVED***s.DEPLOY_PORT }}
          envs: SUDO_PASSWORD
          script: |
            set -e
            for CONF in /etc/nginx/sites-enabled/data.speed4you.net /etc/nginx/sites-enabled/speed4you.net; do
              if [ ! -f "$CONF" ]; then
                echo "Skipping $CONF (not found)"
                continue
              fi
              echo "Configuring $CONF"

              # Enable HTTP/2
              if ! grep -q 'listen 443 ssl http2' "$CONF"; then
                if grep -q 'listen 443 ssl;' "$CONF"; then
                  printf '%s\n' "$SUDO_PASSWORD" | sudo -S -p '' sed -i 's/listen 443 ssl;/listen 443 ssl http2;/' "$CONF"
                  echo "HTTP/2 enabled"
                fi
              fi

              # Enable gzip
              if ! grep -q 'gzip on;' "$CONF"; then
                printf '%s\n' "$SUDO_PASSWORD" | sudo -S -p '' sed -i '/^server {/a\    gzip on;\n    gzip_types text/plain text/css application/json application/javascript image/svg+xml;\n    gzip_min_length 1000;\n    gzip_vary on;' "$CONF"
                echo "gzip enabled"
              fi
            done

            # Test and reload
            printf '%s\n' "$SUDO_PASSWORD" | sudo -S -p '' nginx -t
            printf '%s\n' "$SUDO_PASSWORD" | sudo -S -p '' systemctl reload nginx
            echo "Nginx reloaded with HTTP/2 + gzip"

      - name: Setup h5ai data portal on data.speed4you.net
        continue-on-error: true
        uses: appleboy/ssh-action@v1.2.0
        env:
          SUDO_PASSWORD: ${{ ***REMOVED***s.SUDO_PASSWORD }}
        with:
          host: ${{ ***REMOVED***s.DEPLOY_HOST }}
          username: ${{ ***REMOVED***s.DEPLOY_USER }}
          key: ${{ ***REMOVED***s.DEPLOY_SSH_KEY }}
          port: ${{ ***REMOVED***s.DEPLOY_PORT }}
          envs: SUDO_PASSWORD
          script: |
            set -e
            H5AI_DIR=/var/www/html/data
            CONF=/etc/nginx/sites-enabled/data.speed4you.net
            SPEED_CONF=/etc/nginx/sites-enabled/speed4you.net

            # 1. Check for PHP-FPM
            PHP_AVAIL=false
            PHP_SOCK=""
            if command -v php-fpm >/dev/null 2>&1; then
              PHP_AVAIL=true
              PHP_SOCK=$(ls /var/run/php/php*-fpm.sock 2>/dev/null | head -1)
            fi
            if [ -z "$PHP_SOCK" ]; then
              for s in /var/run/php/php*-fpm.sock; do
                if [ -S "$s" ]; then PHP_SOCK="$s"; break; fi
              done
            fi
            if [ -z "$PHP_SOCK" ]; then PHP_SOCK="127.0.0.1:9000"; fi
            echo "PHP avail=$PHP_AVAIL sock=$PHP_SOCK"

            # 2. Try to install h5ai (if curl/wget available)
            mkdir -p "$H5AI_DIR"
            if [ ! -f "$H5AI_DIR/_h5ai/public/index.php" ]; then
              if command -v curl >/dev/null 2>&1; then
                echo "Downloading h5ai via curl..."
                curl -sL --connect-timeout 10 --max-time 30 https://release.larsjung.de/h5ai/h5ai-0.30.0.zip -o /tmp/h5ai.zip 2>/dev/null || true
              elif command -v wget >/dev/null 2>&1; then
                echo "Downloading h5ai via wget..."
                wget -q --timeout=30 https://release.larsjung.de/h5ai/h5ai-0.30.0.zip -O /tmp/h5ai.zip 2>/dev/null || true
              fi
              if [ -f /tmp/h5ai.zip ] && [ -s /tmp/h5ai.zip ]; then
                if command -v unzip >/dev/null 2>&1; then
                  unzip -qo /tmp/h5ai.zip -d /tmp/h5ai-tmp 2>/dev/null || true
                  if [ -d /tmp/h5ai-tmp/_h5ai ]; then
                    cp -r /tmp/h5ai-tmp/_h5ai "$H5AI_DIR/"
                    echo "h5ai installed"
                  fi
                  rm -rf /tmp/h5ai-tmp
                fi
                rm -f /tmp/h5ai.zip
              fi
              if [ ! -f "$H5AI_DIR/_h5ai/public/index.php" ]; then
                echo "h5ai not installed, will serve static index"
              fi
            else
              echo "h5ai already installed"
            fi

            # 3. Extract SSL cert paths
            CERT=""; CERT_KEY=""
            if [ -f "$CONF" ]; then
              CERT=$(grep -m1 'ssl_certificate ' "$CONF" 2>/dev/null | awk '{print $2}' 2>/dev/null | tr -d ';' 2>/dev/null || true)
              CERT_KEY=$(grep -m1 'ssl_certificate_key ' "$CONF" 2>/dev/null | awk '{print $2}' 2>/dev/null | tr -d ';' 2>/dev/null || true)
            fi
            if [ -z "$CERT" ] && [ -f "$SPEED_CONF" ]; then
              CERT=$(grep -m1 'ssl_certificate ' "$SPEED_CONF" 2>/dev/null | awk '{print $2}' 2>/dev/null | tr -d ';' 2>/dev/null || true)
              CERT_KEY=$(grep -m1 'ssl_certificate_key ' "$SPEED_CONF" 2>/dev/null | awk '{print $2}' 2>/dev/null | tr -d ';' 2>/dev/null || true)
            fi
            if [ -z "$CERT" ]; then
              echo "WARN: no SSL cert in nginx configs"
              CERT="/home/speed4you/.acme.sh/data.speed4you.net_ecc/fullchain.cer"
              CERT_KEY="/home/speed4you/.acme.sh/data.speed4you.net_ecc/data.speed4you.net.key"
            fi
            echo "SSL: $CERT"

            # 4. Write nginx config
            echo "Using SSL cert: $CERT"
            echo "Using SSL key: $CERT_KEY"
            printf '%s\n' "$SUDO_PASSWORD" | sudo -S -p '' tee "$CONF" > /dev/null << 'NGINXEOF'
            server {
                listen 443 ssl http2;
                server_name data.speed4you.net;
                ssl_certificate CERTPH;
                ssl_certificate_key KEYPH;
                root /var/www/html/data;
                index index.html index.php /_h5ai/public/index.php;
                location /.well-known/acme-challenge/ {
                    root /var/www/html;
                }
                location / {
                    try_files $uri $uri/ /_h5ai/public/index.php$is_args$args;
                }
                location ~ ^/_h5ai/private/ {
                    deny all;
                }
                location ~ \.php$ {
                    try_files $uri =404;
                    fastcgi_pass SOCKPH;
                    fastcgi_index index.php;
                    include fastcgi_params;
                    fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
                }
            }
            NGINXEOF
            printf '%s\n' "$SUDO_PASSWORD" | sudo -S -p '' sed -i "s|CERTPH|$CERT|g; s|KEYPH|$CERT_KEY|g; s|SOCKPH|$PHP_PASS|g" "$CONF"
            echo "nginx config written"

            # 5. PHP-FPM + permissions
            printf '%s\n' "$SUDO_PASSWORD" | sudo -S -p '' chown -R www-data:www-data "$H5AI_DIR" 2>/dev/null || true

            # 6. Test and reload nginx
            printf '%s\n' "$SUDO_PASSWORD" | sudo -S -p '' nginx -t 2>&1
            if printf '%s\n' "$SUDO_PASSWORD" | sudo -S -p '' nginx -t 2>/dev/null; then
              printf '%s\n' "$SUDO_PASSWORD" | sudo -S -p '' systemctl reload nginx 2>/dev/null || true
              echo "nginx reloaded"
            else
              echo "nginx config error"
              printf '%s\n' "$SUDO_PASSWORD" | sudo -S -p '' cat "$CONF"
            fi

      - name: Verify deployed frontend bundle
        env:
          EXPECTED_BUNDLE: ${{ steps.frontend_bundle.outputs.bundle }}
        run: |
          set -e
          echo "Expected bundle: $EXPECTED_BUNDLE"
          DEST=/var/www/speed4you.net

          if [ ! -f "$DEST/index.html" ]; then
            echo "FAIL: $DEST/index.html not found" >&2
            exit 1
          fi

          bundle=$(grep -oE 'index-[a-z0-9]+\.js' "$DEST/index.html" | head -n 1 || true)
          echo "Deployed bundle: $bundle"

          if [ "$bundle" != "$EXPECTED_BUNDLE" ]; then
            echo "FAIL: HTML references $bundle, expected $EXPECTED_BUNDLE" >&2
            exit 1
          fi

          if [ ! -f "$DEST/assets/$bundle" ]; then
            echo "FAIL: $DEST/assets/$bundle missing" >&2
            exit 1
          fi
          echo "OK — $bundle verified on disk"

      - name: Deployment summary
        run: |
          echo "Deployment completed."
          echo "Site : https://speed4you.net/"
          echo "API  : https://speed4you.net/portal-api/api/content/latest?limit=3"
