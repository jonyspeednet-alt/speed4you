name: Deploy ISP Entertainment Portal

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: production-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: self-hosted

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend

      - name: Build frontend
        run: npm run build
        working-directory: frontend
        env:
          VITE_APP_BASE: /portal/

      - name: Install backend dependencies (lockfile only)
        run: npm ci
        working-directory: backend

      - name: Strip node_modules from backend transfer
        run: rm -rf node_modules
        working-directory: backend

      - name: Backup production data files
        uses: appleboy/ssh-action@v1.2.0
        env:
          SUDO_PASSWORD: ${{ secrets.SUDO_PASSWORD }}
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT }}
          envs: SUDO_PASSWORD
          script: |
            BACKEND=/home/speed4you/portal-app/backend
            BACKUP_DIR=/home/speed4you/portal-deploy-backups/current
            mkdir -p "$BACKUP_DIR"
            if [ -d "$BACKEND" ]; then
              for f in catalog.json scanner-log.json scanner-roots.json scanner-runtime.json scanner-state.json; do
                if [ -f "$BACKEND/src/data/$f" ]; then
                  cp -a "$BACKEND/src/data/$f" "$BACKUP_DIR/$f"
                fi
              done
            fi
            echo "Backup complete"

      - name: Copy frontend to web root
        uses: appleboy/ssh-action@v1.2.0
        env:
          SUDO_PASSWORD: ${{ secrets.SUDO_PASSWORD }}
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT }}
          envs: SUDO_PASSWORD
          script: |
            SRC=/home/speed4you/actions-runner/_work/speed4you/speed4you/frontend/dist
            DEST=/var/www/html/portal
            if [ -d "$SRC" ]; then
              printf '%s\n' "$SUDO_PASSWORD" | sudo -S -p '' mkdir -p "$DEST"
              printf '%s\n' "$SUDO_PASSWORD" | sudo -S -p '' cp -r "$SRC/." "$DEST/"
              printf '%s\n' "$SUDO_PASSWORD" | sudo -S -p '' chown -R www-data:www-data "$DEST"
              echo "Frontend copied to $DEST"
            else
              echo "ERROR: $SRC not found" >&2
              exit 1
            fi

      - name: Copy backend to app directory
        uses: appleboy/ssh-action@v1.2.0
        env:
          SUDO_PASSWORD: ${{ secrets.SUDO_PASSWORD }}
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT }}
          envs: SUDO_PASSWORD
          script: |
            SRC=/home/speed4you/actions-runner/_work/speed4you/speed4you/backend
            DEST=/home/speed4you/portal-app/backend
            if [ -d "$SRC" ]; then
              mkdir -p "$DEST"
              cp -a "$SRC/." "$DEST/"
              echo "Backend copied to $DEST"
            else
              echo "ERROR: $SRC not found" >&2
              exit 1
            fi

      - name: Install deps, write .env, restart, health check
        uses: appleboy/ssh-action@v1.2.0
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          SUDO_PASSWORD: ${{ secrets.SUDO_PASSWORD }}
          CORS_ALLOWED_ORIGINS: ${{ secrets.CORS_ALLOWED_ORIGINS }}
          PLAYER_CACHE_ROOT: ${{ secrets.PLAYER_CACHE_ROOT }}
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_PORT: ${{ secrets.DB_PORT }}
          DB_NAME: ${{ secrets.DB_NAME }}
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT }}
          envs: TMDB_API_KEY,JWT_SECRET,SUDO_PASSWORD,CORS_ALLOWED_ORIGINS,PLAYER_CACHE_ROOT,DB_HOST,DB_PORT,DB_NAME,DB_USER,DB_PASSWORD
          script: |
            set -e
            BACKEND=/home/speed4you/portal-app/backend
            BACKUP_DIR=/home/speed4you/portal-deploy-backups/current

            # Restore production data files
            for f in catalog.json scanner-log.json scanner-roots.json scanner-runtime.json scanner-state.json; do
              if [ -f "$BACKUP_DIR/$f" ]; then
                cp -a "$BACKUP_DIR/$f" "$BACKEND/src/data/$f" 2>/dev/null || true
              fi
            done

            cd "$BACKEND"
            npm ci --omit=dev

            cat > .env <<EOF
            PORT=4100
            JWT_SECRET=${JWT_SECRET}
            TMDB_API_KEY=${TMDB_API_KEY}
            CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS}
            PLAYER_CACHE_ROOT=${PLAYER_CACHE_ROOT}
            DB_HOST=${DB_HOST}
            DB_PORT=${DB_PORT}
            DB_NAME=${DB_NAME}
            DB_USER=${DB_USER}
            DB_PASSWORD=${DB_PASSWORD}
            FFMPEG_PATH=/usr/bin/ffmpeg
            FFPROBE_PATH=/usr/bin/ffprobe
            EOF

            echo "Stopping old backend..."
            if [ -f /home/speed4you/portal-app/backend.pid ]; then
              OLD_PID=$(cat /home/speed4you/portal-app/backend.pid 2>/dev/null || true)
              if [ -n "$OLD_PID" ] && kill -0 "$OLD_PID" 2>/dev/null; then
                kill "$OLD_PID" || true
                sleep 2
              fi
            fi

            echo "Restarting service..."
            printf '%s\n' "$SUDO_PASSWORD" | sudo -S -p '' systemctl restart isp-portal.service

            echo "Health check..."
            for i in $(seq 1 30); do
              if curl -fsS http://127.0.0.1:4100/health >/dev/null 2>&1; then
                echo "Health check passed"
                exit 0
              fi
              sleep 2
            done

            echo "Health check failed" >&2
            exit 1

      - name: Deployment summary
        run: |
          echo "Deployment completed."
          echo "Public site: https://data.speed4you.net/portal"
          echo "API check: https://data.speed4you.net/portal-api/api/content/latest?limit=3"
