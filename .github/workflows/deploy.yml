name: Deploy ISP Entertainment Portal

on:
  push:
    branches:
      - main
  workflow_dispatch:


jobs:
  deploy:
    runs-on: self-hosted

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend

      - name: Build frontend
        run: npm run build
        working-directory: frontend
        env:
          VITE_APP_BASE: /

      - name: Record frontend bundle fingerprint
        id: frontend_bundle
        run: |
          set -e
          bundle=$(grep -oE 'index-[a-z0-9]+\.js' frontend/dist/index.html | head -n 1)
          if [ -z "$bundle" ]; then
            echo "Could not find main frontend bundle in frontend/dist/index.html" >&2
            exit 1
          fi
          echo "bundle=$bundle" >> "$GITHUB_OUTPUT"
          echo "Built frontend main bundle: $bundle"

      - name: Install backend dependencies (lockfile only)
        run: npm ci
        working-directory: backend

      - name: Strip node_modules from backend transfer
        run: rm -rf node_modules
        working-directory: backend

      - name: Check server disk space
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ ***REMOVED***s.DEPLOY_HOST }}
          username: ${{ ***REMOVED***s.DEPLOY_USER }}
          key: ${{ ***REMOVED***s.DEPLOY_SSH_KEY }}
          port: ${{ ***REMOVED***s.DEPLOY_PORT }}
          script: |
            echo "=== Disk space ==="
            df -h /var/www/html/ /home/speed4you/ / 2>/dev/null || df -h
            echo "=== Frontend destination ==="
            ls -la /var/www/html/portal/ 2>/dev/null | head -5 || echo "(empty or missing)"
            echo "=== Build output ==="
            ls -la /home/speed4you/actions-runner/_work/speed4you/speed4you/frontend/dist/ 2>/dev/null | head -5 || echo "(empty or missing)"

      - name: Backup production data files
        uses: appleboy/ssh-action@v1.2.0
        env:
          SUDO_PASSWORD: ${{ ***REMOVED***s.SUDO_PASSWORD }}
        with:
          host: ${{ ***REMOVED***s.DEPLOY_HOST }}
          username: ${{ ***REMOVED***s.DEPLOY_USER }}
          key: ${{ ***REMOVED***s.DEPLOY_SSH_KEY }}
          port: ${{ ***REMOVED***s.DEPLOY_PORT }}
          envs: SUDO_PASSWORD
          script: |
            BACKEND=/home/speed4you/portal-app/backend
            BACKUP_DIR=/home/speed4you/portal-deploy-backups/current
            mkdir -p "$BACKUP_DIR"
            if [ -d "$BACKEND" ]; then
              for f in catalog.json scanner-log.json scanner-roots.json scanner-runtime.json scanner-state.json; do
                if [ -f "$BACKEND/src/data/$f" ]; then
                  cp -a "$BACKEND/src/data/$f" "$BACKUP_DIR/$f"
                fi
              done
            fi
            echo "Backup complete"

      - name: Copy frontend without sudo
        run: |
          SRC=frontend/dist
          DEST_USER=/home/speed4you/portal-frontend
          echo "Copying $SRC to $DEST_USER..."
          mkdir -p "$DEST_USER"
          cp -r "$SRC/." "$DEST_USER/"
          echo "Copy complete: $(find "$DEST_USER" -type f | wc -l) files"

      - name: Deploy frontend via sudo
        run: |
          set -e
          SRC_USER=/home/speed4you/portal-frontend
          DEST=/var/www/speed4you.net
          printf '%s\n' "$SUDO_PASSWORD" | sudo -S -p '' mkdir -p "$DEST"
          printf '%s\n' "$SUDO_PASSWORD" | sudo -S -p '' cp -r "$SRC_USER/." "$DEST/"
          printf '%s\n' "$SUDO_PASSWORD" | sudo -S -p '' chown -R www-data:www-data "$DEST"
          printf '%s\n' "$SUDO_PASSWORD" | sudo -S -p '' chmod -R o+rX "$DEST"
          echo "Frontend deployed to $DEST"
        env:
          SUDO_PASSWORD: ${{ ***REMOVED***s.SUDO_PASSWORD }}

      - name: Copy backend to app directory
        uses: appleboy/ssh-action@v1.2.0
        env:
          SUDO_PASSWORD: ${{ ***REMOVED***s.SUDO_PASSWORD }}
        with:
          host: ${{ ***REMOVED***s.DEPLOY_HOST }}
          username: ${{ ***REMOVED***s.DEPLOY_USER }}
          key: ${{ ***REMOVED***s.DEPLOY_SSH_KEY }}
          port: ${{ ***REMOVED***s.DEPLOY_PORT }}
          envs: SUDO_PASSWORD
          script: |
            SRC=/home/speed4you/actions-runner/_work/speed4you/speed4you/backend
            DEST=/home/speed4you/portal-app/backend
            if [ -d "$SRC" ]; then
              mkdir -p "$DEST"
              cp -a "$SRC/." "$DEST/"
              echo "Backend copied to $DEST"
              # Diagnostic: check admin routes file
              echo "=== Checking admin.js in SRC ==="
              grep -n 'rematch\b' "$SRC/src/routes/admin.js" || echo "(no 'rematch' in SRC admin.js)"
              echo "=== Checking admin.js in DEST ==="
              grep -n 'rematch\b' "$DEST/src/routes/admin.js" || echo "(no 'rematch' in DEST admin.js)"
              # Check if adminController has rematchMetadata
              echo "=== Checking adminController.js in SRC ==="
              grep -c 'rematchMetadata' "$SRC/src/controllers/adminController.js" || echo "(no rematchMetadata in SRC)"
              echo "=== Checking adminController.js in DEST ==="
              grep -c 'rematchMetadata' "$DEST/src/controllers/adminController.js" || echo "(no rematchMetadata in DEST)"
            else
              echo "ERROR: $SRC not found" >&2
              exit 1
            fi
            # Copy disk cleanup script
            if [ -f "$SRC/scripts/cleanup-disk.sh" ]; then
              printf '%s\n' "$SUDO_PASSWORD" | sudo -S -p '' cp "$SRC/scripts/cleanup-disk.sh" /usr/local/bin/cleanup-disk.sh
              printf '%s\n' "$SUDO_PASSWORD" | sudo -S -p '' chmod +x /usr/local/bin/cleanup-disk.sh
              echo "Cleanup script installed"
            fi

      - name: Install deps, write .env, restart, health check
        uses: appleboy/ssh-action@v1.2.0
        env:
          TMDB_API_KEY: ${{ ***REMOVED***s.TMDB_API_KEY }}
          OMDB_API_KEY: ${{ ***REMOVED***s.OMDB_API_KEY }}
          JWT_SECRET: ${{ ***REMOVED***s.JWT_SECRET }}
          SUDO_PASSWORD: ${{ ***REMOVED***s.SUDO_PASSWORD }}
          CORS_ALLOWED_ORIGINS: ${{ ***REMOVED***s.CORS_ALLOWED_ORIGINS }}
          PLAYER_CACHE_ROOT: ${{ ***REMOVED***s.PLAYER_CACHE_ROOT }}
          DB_HOST: ${{ ***REMOVED***s.DB_HOST }}
          DB_PORT: ${{ ***REMOVED***s.DB_PORT }}
          DB_NAME: ${{ ***REMOVED***s.DB_NAME }}
          DB_USER: ${{ ***REMOVED***s.DB_USER }}
          DB_PASSWORD: ${{ ***REMOVED***s.DB_PASSWORD }}
          ADMIN_USERNAME: ${{ ***REMOVED***s.ADMIN_USERNAME }}
          ADMIN_PASSWORD_HASH: ${{ ***REMOVED***s.ADMIN_PASSWORD_HASH }}
          PUBLIC_API_PER_IP_LIMIT: ${{ ***REMOVED***s.PUBLIC_API_PER_IP_LIMIT }}
          DB_POOL_MAX: ${{ ***REMOVED***s.DB_POOL_MAX }}
          PLAYER_MAX_CONCURRENT_LIVE_STREAMS: ${{ ***REMOVED***s.PLAYER_MAX_CONCURRENT_LIVE_STREAMS }}
        with:
          host: ${{ ***REMOVED***s.DEPLOY_HOST }}
          username: ${{ ***REMOVED***s.DEPLOY_USER }}
          key: ${{ ***REMOVED***s.DEPLOY_SSH_KEY }}
          port: ${{ ***REMOVED***s.DEPLOY_PORT }}
          envs: TMDB_API_KEY,OMDB_API_KEY,JWT_SECRET,SUDO_PASSWORD,CORS_ALLOWED_ORIGINS,PLAYER_CACHE_ROOT,DB_HOST,DB_PORT,DB_NAME,DB_USER,DB_PASSWORD,ADMIN_USERNAME,ADMIN_PASSWORD_HASH,PUBLIC_API_PER_IP_LIMIT,DB_POOL_MAX,PLAYER_MAX_CONCURRENT_LIVE_STREAMS
          script: |
            set -e
            BACKEND=/home/speed4you/portal-app/backend
            BACKUP_DIR=/home/speed4you/portal-deploy-backups/current

            # Restore production data files
            for f in catalog.json scanner-log.json scanner-roots.json scanner-runtime.json scanner-state.json; do
              if [ -f "$BACKUP_DIR/$f" ]; then
                cp -a "$BACKUP_DIR/$f" "$BACKEND/src/data/$f" 2>/dev/null || true
              fi
            done

            cd "$BACKEND"
            npm ci --omit=dev

            # Ensure all required origins are always in CORS
            CORS="${CORS_ALLOWED_ORIGINS}"
            if [[ ",$CORS," != *",https://speed4you.net,"* ]]; then
              CORS="${CORS},https://speed4you.net"
            fi
            if [[ ",$CORS," != *",https://data.speed4you.net,"* ]]; then
              CORS="${CORS},https://data.speed4you.net"
            fi
            if [[ ",$CORS," != *",https://103.79.182.226,"* ]]; then
              CORS="${CORS},https://103.79.182.226"
            fi

            # Use OMDB_API_KEY from ***REMOVED***, fallback to hardcoded key if not set (remove once ***REMOVED*** is configured)
            OMDB_KEY="${OMDB_API_KEY:-***REMOVED***}"
            # Ensure Extra_Storage directories exist (for caches, nginx temp, etc.)
            printf '%s\n' "$SUDO_PASSWORD" | sudo -S -p '' mkdir -p /var/www/html/Extra_Storage/nginx-tmp/proxy
            printf '%s\n' "$SUDO_PASSWORD" | sudo -S -p '' mkdir -p /var/www/html/Extra_Storage/scanner-cache
            # Ensure player cache dir exists and is writable by speed4you user (backend runs as speed4you)
            printf '%s\n' "$SUDO_PASSWORD" | sudo -S -p '' mkdir -p /var/www/html/Extra_Storage/portal-media-cache
            printf '%s\n' "$SUDO_PASSWORD" | sudo -S -p '' chown speed4you:speed4you /var/www/html/Extra_Storage/portal-media-cache

            SCANNER_CACHE_DIR=/var/www/html/Extra_Storage/scanner-cache
            cat > .env <<EOF
            PORT=4100
            JWT_SECRET=${JWT_SECRET}
            TMDB_API_KEY=${TMDB_API_KEY}
            OMDB_API_KEY=${OMDB_KEY}
            CORS_ALLOWED_ORIGINS=${CORS}
            PLAYER_CACHE_ROOT=${PLAYER_CACHE_ROOT}
            SCANNER_CACHE_DIR=${SCANNER_CACHE_DIR}
            MEDIA_NORMALIZER_TEMP_DIR=${MEDIA_NORMALIZER_TEMP_DIR}
            PUBLIC_API_PER_IP_LIMIT=${PUBLIC_API_PER_IP_LIMIT:-200}
            DB_POOL_MAX=${DB_POOL_MAX:-50}
            PLAYER_MAX_CONCURRENT_LIVE_STREAMS=${PLAYER_MAX_CONCURRENT_LIVE_STREAMS:-10}
            DB_HOST=${DB_HOST}
            DB_PORT=${DB_PORT}
            DB_NAME=${DB_NAME}
            DB_USER=${DB_USER}
            DB_PASSWORD=${DB_PASSWORD}
            FFMPEG_PATH=/usr/bin/ffmpeg
            FFPROBE_PATH=/usr/bin/ffprobe
            ADMIN_USERNAME=${ADMIN_USERNAME}
            ADMIN_PASSWORD_HASH=${ADMIN_PASSWORD_HASH}
            EOF

            echo "Ensuring new metadata routes exist in admin.js..."
            python3 << 'PYEOF'
            import os, re

            BACKEND = '/home/speed4you/portal-app/backend'

            print("=== Checking admin.js ===")
            ajs = os.path.join(BACKEND, 'src/routes/admin.js')
            with open(ajs) as f:
                content = f.read()

            if 'rematch' not in content:
                print("Adding rematch/cleanup routes to admin.js")
                routes_to_add = (
                    "router.post('/metadata/rematch', asyncRoute(adminController.rematchMetadata));\n"
                    "router.post('/metadata/cleanup-season-duplicates', asyncRoute(adminController.cleanupSeasonDuplicates));\n"
                )
                content = re.sub(
                    r"(router\.post\('/metadata/tmdb'.*?\n)",
                    r"\1" + routes_to_add,
                    content
                )
                with open(ajs, 'w') as f:
                    f.write(content)
                print("admin.js patched OK")
            else:
                print("rematch already in admin.js, skipping")

            print("=== Checking adminController.js ===")
            acjs = os.path.join(BACKEND, 'src/controllers/adminController.js')
            with open(acjs) as f:
                content = f.read()

            if 'rematchMetadata' not in content:
                print("Adding functions to adminController.js")
                # Build the JavaScript source for the two functions
                func1 = '''
            exports.rematchMetadata = async (req, res) => {
              const { enrichItemWithMetadata } = require('../services/scanner-enhanced-metadata');
              const dryRun = req.query.dry === 'true' || req.query.dry === '1';
              const batchSize = Math.min(20, Math.max(1, Number(req.body?.batchSize || 5)));
              const queryResult = await db.query(
                `SELECT id, payload FROM content_catalog WHERE metadata_status IN ('skipped','needs_review','not_found','failed') ORDER BY id`,
              );
              const total = queryResult.rows.length;
              let matched = 0, failed = 0, errors = [];
              for (let i = 0; i < queryResult.rows.length; i += batchSize) {
                const batch = queryResult.rows.slice(i, i + batchSize);
                await Promise.all(batch.map(async (row) => {
                  try {
                    const item = row.payload;
                    const enriched = await enrichItemWithMetadata(item);
                    if (!dryRun) await updateItem(item.id, enriched);
                    matched++;
                  } catch (err) { failed++; errors.push({ id: row.id, error: err.message }); }
                }));
              }
              res.json({ ok: true, dryRun, total, matched, failed, errors: errors.slice(0, 50) });
            };

            exports.cleanupSeasonDuplicates = async (req, res) => {
              const dryRun = req.query.dry === 'true' || req.query.dry === '1';
              const queryResult = await db.query(
                `SELECT id, title, source_path, payload FROM content_catalog WHERE content_type = 'series' AND (source_path ILIKE '%/Season %' OR source_path ~ '/S[0-9]{2}(/|$)') ORDER BY id`,
              );
              const entries = (queryResult.rows || []).map((row) => ({ id: row.id, title: row.title, sourcePath: row.source_path, payloadTitle: row.payload?.title || '' }));
              let deleted = 0;
              if (!dryRun && entries.length > 0) {
                const ids = entries.map((e) => e.id);
                const ph = ids.map((_, i) => '$' + (i + 1)).join(',');
                await db.query('DELETE FROM content_catalog WHERE id IN (' + ph + ')', ids);
                deleted = entries.length;
              }
              res.json({ ok: true, dryRun, total: entries.length, deleted, entries });
            };

            '''
                content = content.replace(
                    'async function cleanupOrphanSeriesEpisodes(req, res) {',
                    func1 + 'async function cleanupOrphanSeriesEpisodes(req, res) {'
                )
                with open(acjs, 'w') as f:
                    f.write(content)
                print("adminController.js patched OK")
            else:
                print("rematchMetadata already in adminController.js, skipping")

            print("=== Patching complete ===")
            PYEOF

            echo "Patching scanner.js - add season folder skip..."
            python3 << 'PYEOF'
            import os
            BACKEND = '/home/speed4you/portal-app/backend'
            sjs = os.path.join(BACKEND, 'src/services/scanner.js')
            with open(sjs) as f: content = f.read()
            if 'looksLikeSeasonFolder(' in content and 'if (looksLikeSeasonFolder(directory))' not in content:
                print("Adding season folder skip to collectDirectoriesIncrementally")
                lines = content.split('\n')
                for i, line in enumerate(lines):
                    if 'listDirectories(current.folderPath)' in line and i+2 < len(lines):
                        indent = lines[i+1][:len(lines[i+1]) - len(lines[i+1].lstrip())]
                        if 'looksLikeSeasonFolder' not in lines[i+2]:
                            skip = [
                                indent + "// Skip season-like folders (Season 01, S01, Specials, etc.)",
                                indent + "if (looksLikeSeasonFolder(directory)) {",
                                indent + "  continue;",
                                indent + "}",
                            ]
                            for j, sl in enumerate(skip):
                                lines.insert(i+2+j, sl)
                            break
                content = '\n'.join(lines)
                with open(sjs, 'w') as f: f.write(content)
                print("scanner.js patched OK")
            else:
                print("scanner.js already patched or looksLikeSeasonFolder missing, skipping")
            PYEOF

            echo "Patching metadata-enricher.js - add TV noise patterns..."
            python3 << 'PYEOF'
            import os
            BACKEND = '/home/speed4you/portal-app/backend'
            mej = os.path.join(BACKEND, 'src/services/metadata-enricher.js')
            with open(mej) as f: content = f.read()
            if 'TV Series' not in content:
                print("Adding TV Series/Mini Series noise patterns")
                content = content.replace(
                    '  /\\bepisode\\s*\\d{1,3}\\b/gi,\n    /\\[[^\\]]+\\]/g,',
                    '  /\\bepisode\\s*\\d{1,3}\\b/gi,\n  /\\bTV\\s*(Mini\\s*)?Series\\b/gi,\n  /\\([^)]*\\bTV\\s*(Mini\\s*)?Series\\b[^)]*\\)/gi,\n    /\\[[^\\]]+\\]/g,'
                )
                with open(mej, 'w') as f: f.write(content)
                print("metadata-enricher.js patched OK")
            else:
                print("TV Series patterns already in metadata-enricher.js, skipping")
            PYEOF

            echo "Patching index.js - add deploy field to health endpoint and health-deploy route..."
            python3 << 'PYEOF'
            import os
            BACKEND = '/home/speed4you/portal-app/backend'
            ind = os.path.join(BACKEND, 'src/index.js')
            with open(ind) as f: content = f.read()
            if "deploy: '" not in content:
                print("Adding deploy field to health endpoint")
                content = content.replace(
                    "res.json({ status: 'ok', timestamp: new Date().toISOString() });",
                    "res.json({ status: 'ok', timestamp: new Date().toISOString(), deploy: 'v6', patched: true });"
                )
                with open(ind, 'w') as f: f.write(content)
                print("index.js patched OK - deploy+patched fields added")
            else:
                print("deploy field already in index.js, checking if health-deploy route exists...")
                if "health-deploy" not in content:
                    content = content.replace(
                        "app.get('/health',",
                        "app.get('/health-deploy', (req, res) => res.json({ status: 'ok', deploy: 'v6', ts: Date.now() }));\napp.get('/health',",
                    )
                    with open(ind, 'w') as f: f.write(content)
                    print("health-deploy route added")
                else:
                    print("health-deploy route already exists")
            PYEOF

            echo "Stopping old backend..."
            if [ -f /home/speed4you/portal-app/backend.pid ]; then
              OLD_PID=$(cat /home/speed4you/portal-app/backend.pid 2>/dev/null || true)
              if [ -n "$OLD_PID" ] && kill -0 "$OLD_PID" 2>/dev/null; then
                kill "$OLD_PID" || true
                sleep 2
              fi
            fi

            echo "Restarting service..."
            printf '%s\n' "$SUDO_PASSWORD" | sudo -S -p '' systemctl daemon-reload
            printf '%s\n' "$SUDO_PASSWORD" | sudo -S -p '' systemctl enable isp-portal.service 2>/dev/null || true
            printf '%s\n' "$SUDO_PASSWORD" | sudo -S -p '' systemctl restart isp-portal.service

            echo "Health check..."
            for i in $(seq 1 30); do
              if curl -fsS http://127.0.0.1:4100/health >/dev/null 2>&1; then
                echo "Health check passed"
                break
              fi
              sleep 2
            done

            echo "=== Generating admin JWT and running cleanup + rematch ==="
            JWT_SECRET_VAL=$(grep JWT_SECRET "$BACKEND/.env" 2>/dev/null | cut -d= -f2)
            if [ -n "$JWT_SECRET_VAL" ]; then
              export JWT_SIGN_SECRET="$JWT_SECRET_VAL"
              TOKEN=$(cd "$BACKEND" && node -e "
                const jwt = require('jsonwebtoken');
                console.log(jwt.sign({id:1, username:'admin', role:'admin'}, process.env['JWT_SIGN_SECRET'], {expiresIn:'1h'}));
              " 2>/dev/null || echo "")
              if [ -n "$TOKEN" ]; then
                echo "JWT token generated"

                echo "--- Step 1: Dry-run cleanup-season-duplicates ---"
                DRY_RESP=$(curl -sf -X POST http://127.0.0.1:4100/api/admin/metadata/cleanup-season-duplicates?dry=true \
                  -H "Authorization: Bearer $TOKEN" -H "Content-Type: application/json" 2>&1)
                echo "Dry-run response: $(echo "$DRY_RESP" | head -c 500)"
                DRY_COUNT=$(echo "$DRY_RESP" | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('total',0))" 2>/dev/null || echo "0")
                echo "Dry-run shows $DRY_COUNT entries"

                if [ "$DRY_COUNT" -gt 0 ]; then
                  echo "--- Step 2: Actually cleaning up $DRY_COUNT season duplicates ---"
                  CLEAN_RESP=$(curl -sf -X POST http://127.0.0.1:4100/api/admin/metadata/cleanup-season-duplicates \
                    -H "Authorization: Bearer $TOKEN" -H "Content-Type: application/json" 2>&1)
                  echo "Cleanup response: $(echo "$CLEAN_RESP" | head -c 300)"
                else
                  echo "No season duplicates to clean up (or dry-run parsing failed)"
                fi

                echo "--- Step 3: Rematching skipped/needs_review metadata ---"
                REMATCH_RESP=$(curl -sf -X POST http://127.0.0.1:4100/api/admin/metadata/rematch \
                  -H "Authorization: Bearer $TOKEN" -H "Content-Type: application/json" -d '{}' 2>&1)
                echo "Rematch response: $(echo "$REMATCH_RESP" | head -c 500)"
              else
                echo "Could not generate JWT token"
                curl -sf http://127.0.0.1:4100/health 2>/dev/null | head -c 200 || echo "health failed"
              fi
            else
              echo "No JWT_SECRET in .env, skipping auth test"
              # Just check health
              curl -sf http://127.0.0.1:4100/health 2>/dev/null | head -c 200 || echo "health failed"
            fi

      - name: Setup data portal on data.speed4you.net
        uses: appleboy/ssh-action@v1.2.0
        env:
          SUDO_PASSWORD: ${{ ***REMOVED***s.SUDO_PASSWORD }}
        with:
          host: ${{ ***REMOVED***s.DEPLOY_HOST }}
          username: ${{ ***REMOVED***s.DEPLOY_USER }}
          key: ${{ ***REMOVED***s.DEPLOY_SSH_KEY }}
          port: ${{ ***REMOVED***s.DEPLOY_PORT }}
          envs: SUDO_PASSWORD
          script: |
            CONF=/etc/nginx/sites-enabled/data.speed4you.net
            SPEED_CONF=/etc/nginx/sites-enabled/speed4you.net
            ROOT=/var/www/html
            echo "=== data portal setup start ==="
            # Remove any old redirect configs that might conflict
            for old in /etc/nginx/sites-enabled/data.speed4you.net.conf /etc/nginx/conf.d/data.speed4you.net.conf; do
              if [ -f "$old" ]; then
                printf '%s\n' "$SUDO_PASSWORD" | sudo -S -p '' rm -f "$old"
                echo "Removed old config: $old"
              fi
            done
            # Use data.speed4you.net specific cert (acme.sh), fallback to speed4you.net cert
            for p in \
              /home/speed4you/.acme.sh/data.speed4you.net_ecc/fullchain.cer \
              /home/speed4you/.acme.sh/data.speed4you.net/fullchain.cer; do
              if [ -f "$p" ]; then
                CERT="$p"
                KEY_PREFIX="${p%fullchain.cer}"
                if [ -f "${KEY_PREFIX}data.speed4you.net.key" ]; then
                  CERT_KEY="${KEY_PREFIX}data.speed4you.net.key"
                elif [ -f "${KEY_PREFIX}data.speed4you.net_ecc.key" ]; then
                  CERT_KEY="${KEY_PREFIX}data.speed4you.net_ecc.key"
                else
                  CERT_KEY="${KEY_PREFIX}data.speed4you.net.key"
                fi
                echo "Found data.speed4you.net cert: $CERT"
                break
              fi
            done
            if [ -z "$CERT" ]; then
              echo "No data.speed4you.net cert found, using speed4you.net cert"
              CERT=$(grep -m1 'ssl_certificate ' "$SPEED_CONF" | awk '{print $2}' | tr -d ';')
              CERT_KEY=$(grep -m1 'ssl_certificate_key ' "$SPEED_CONF" | awk '{print $2}' | tr -d ';')
            fi
            echo "CERT: $CERT"
            echo "KEY: $CERT_KEY"
            # Try to install PHP-FPM + h5ai for nice UI; fallback to styled autoindex
            PHP_AVAIL=false
            for sock in /run/php/php*-fpm.sock /var/run/php/php*-fpm.sock; do [ -S "$sock" ] && { PHP_AVAIL=true; PHP_SOCK="$sock"; break; }; done
            if ! $PHP_AVAIL; then
              echo "Updating apt sources..."
              printf '%s\n' "$SUDO_PASSWORD" | sudo -S -p '' DEBIAN_FRONTEND=noninteractive apt-get update -qq 2>&1 || echo "apt-get update had issues (continuing)"
              echo "Installing PHP-FPM..."
              for i in 1 2 3; do
                printf '%s\n' "$SUDO_PASSWORD" | sudo -S -p '' DEBIAN_FRONTEND=noninteractive apt-get install -y php-fpm php-json 2>&1 && { echo "PHP-FPM installed"; break; }
                if [ $i -lt 3 ]; then echo "Retrying PHP-FPM install ($i/3)..."; sleep 5; fi
              done
              echo "Starting PHP-FPM..."
              printf '%s\n' "$SUDO_PASSWORD" | sudo -S -p '' service php*-fpm start 2>/dev/null || true
              printf '%s\n' "$SUDO_PASSWORD" | sudo -S -p '' systemctl start php*-fpm 2>/dev/null || true
              sleep 2
              for sock in /run/php/php*-fpm.sock /var/run/php/php*-fpm.sock; do [ -S "$sock" ] && { PHP_AVAIL=true; PHP_SOCK="$sock"; break; }; done
              if $PHP_AVAIL; then
                echo "PHP-FPM socket found: $PHP_SOCK"
                # Tune PHP-FPM for performance
                FPM_CONF=$(printf '%s\n' /etc/php/*/fpm/pool.d/www.conf 2>/dev/null | head -1)
                if [ -n "$FPM_CONF" ]; then
                  printf '%s\n' "$SUDO_PASSWORD" | sudo -S -p '' sed -i 's/^pm = dynamic/pm = ondemand/' "$FPM_CONF"
                  printf '%s\n' "$SUDO_PASSWORD" | sudo -S -p '' sed -i 's/^pm\.max_children = [0-9]*/pm.max_children = 50/' "$FPM_CONF"
                  printf '%s\n' "$SUDO_PASSWORD" | sudo -S -p '' sed -i 's/^pm\.start_servers = [0-9]*/pm.start_servers = 2/' "$FPM_CONF"
                  printf '%s\n' "$SUDO_PASSWORD" | sudo -S -p '' sed -i 's/^pm\.min_spare_servers = [0-9]*/pm.min_spare_servers = 1/' "$FPM_CONF"
                  printf '%s\n' "$SUDO_PASSWORD" | sudo -S -p '' sed -i 's/^pm\.max_spare_servers = [0-9]*/pm.max_spare_servers = 5/' "$FPM_CONF"
                  printf '%s\n' "$SUDO_PASSWORD" | sudo -S -p '' systemctl restart php*-fpm 2>/dev/null || true
                  echo "PHP-FPM tuned (ondemand, max_children=50)"
                fi
              else
                echo "PHP-FPM socket not found. Checking installed packages..."
                dpkg -l | grep php 2>/dev/null || echo "No php packages found"
              fi
            fi
            H5AI_OK=false
            if $PHP_AVAIL; then
              echo "PHP-FPM available ($PHP_SOCK)"
              [ -f "$ROOT/_h5ai/public/index.php" ] && H5AI_OK=true
              if ! $H5AI_OK; then
                TMPZ=/tmp/h5ai.zip; TMPD=/tmp/h5aitmp
                H5AI_URL="https://github.com/lrsjng/h5ai/releases/download/v0.30.0/h5ai-0.30.0.zip"
                echo "Downloading h5ai from $H5AI_URL ..."
                curl -fSslL --connect-timeout 15 --max-time 60 "$H5AI_URL" -o "$TMPZ" 2>&1 || { echo "Download failed"; rm -f "$TMPZ"; }
                if [ -f "$TMPZ" ] && [ -s "$TMPZ" ]; then
                  size=$(stat --printf="%s" "$TMPZ" 2>/dev/null || wc -c < "$TMPZ")
                  echo "h5ai downloaded ($size bytes)"
                  if [ "$size" -gt 50000 ]; then
                    mkdir -p "$TMPD"
                    unzip -qo "$TMPZ" -d "$TMPD" 2>&1 || echo "unzip failed"
                  else
                    echo "Downloaded file too small ($size bytes)"
                  fi
                fi
                H5AI_SRC=$(find "$TMPD" -type d -name _h5ai 2>/dev/null | head -1)
                if [ -n "$H5AI_SRC" ]; then
                  echo "Found _h5ai at $H5AI_SRC"
                  printf '%s\n' "$SUDO_PASSWORD" | sudo -S -p '' cp -r "$H5AI_SRC" "$ROOT/"
                  printf '%s\n' "$SUDO_PASSWORD" | sudo -S -p '' chown -R www-data:www-data "$ROOT/_h5ai"
                  echo "h5ai copied to $ROOT/_h5ai"
                fi
                [ -f "$ROOT/_h5ai/public/index.php" ] && { H5AI_OK=true; echo "h5ai installed successfully"; } || echo "h5ai installation failed"
                rm -rf "$TMPD" "$TMPZ"
              fi
            fi
            # Optimize h5ai config: fallback mode (no AJAX loading text), disable foldersize (slow)
            H5AI_OPT="$ROOT/_h5ai/private/conf/options.json"
            if [ -f "$H5AI_OPT" ]; then
              php -r '
                $json = file_get_contents("'"$H5AI_OPT"'");
                // strip JS-style comments
                $json = preg_replace("/\/\*[\s\S]*?\*\//", "", $json);
                $opt = json_decode($json, true);
                if ($opt) {
                  $opt["view"]["fallbackMode"] = true;
                  $opt["foldersize"]["enabled"] = false;
                  file_put_contents("'"$H5AI_OPT"'", json_encode($opt, JSON_PRETTY_PRINT | JSON_UNESCAPED_SLASHES));
                  echo "h5ai config optimized\n";
                } else { echo "h5ai config parse FAILED\n"; }
              ' 2>&1
            fi
            # Remove old custom file browser files if they exist
            rm -f "$ROOT/index.html" "$ROOT/api.php" "$ROOT/.d.css"
            # Ensure nginx temp + log dirs on Extra_Storage (prevents root disk full)
            printf '%s\n' "$SUDO_PASSWORD" | sudo -S -p '' mkdir -p /var/www/html/Extra_Storage/nginx-tmp/proxy
            printf '%s\n' "$SUDO_PASSWORD" | sudo -S -p '' mkdir -p /var/www/html/Extra_Storage/nginx-logs
            # Setup FastCGI cache for h5ai (write to http-level conf.d)
            printf '%s\n' "$SUDO_PASSWORD" | sudo -S -p '' mkdir -p /var/www/html/Extra_Storage/nginx-tmp/fcgi-cache
            echo 'fastcgi_cache_path /var/www/html/Extra_Storage/nginx-tmp/fcgi-cache levels=1:2 keys_zone=H5AI_CACHE:10m inactive=30m max_size=500m;' > /tmp/h5ai-cache.conf
            printf '%s\n' "$SUDO_PASSWORD" | sudo -S -p '' cp /tmp/h5ai-cache.conf /etc/nginx/conf.d/h5ai-cache.conf && rm -f /tmp/h5ai-cache.conf
            # Build nginx config — use h5ai for directory listings
            echo "server {" > /tmp/dataconf
            echo "    listen 443 ssl http2;" >> /tmp/dataconf
            echo "    server_name data.speed4you.net;" >> /tmp/dataconf
            echo "    ssl_certificate $CERT;" >> /tmp/dataconf
            echo "    ssl_certificate_key $CERT_KEY;" >> /tmp/dataconf
            echo "    root $ROOT;" >> /tmp/dataconf
            echo "    index index.php index.html;" >> /tmp/dataconf
            echo "    access_log /var/www/html/Extra_Storage/nginx-logs/data-access.log;" >> /tmp/dataconf
            echo "    error_log /var/www/html/Extra_Storage/nginx-logs/data-error.log;" >> /tmp/dataconf
            echo "    proxy_temp_path /var/www/html/Extra_Storage/nginx-tmp/proxy 1 2;" >> /tmp/dataconf
            echo "    sendfile on;" >> /tmp/dataconf
            echo "    tcp_nopush on;" >> /tmp/dataconf
            echo "    open_file_cache max=1000 inactive=20s;" >> /tmp/dataconf
            echo "    open_file_cache_valid 30s;" >> /tmp/dataconf
            echo "    open_file_cache_min_uses 2;" >> /tmp/dataconf
            echo "    open_file_cache_errors on;" >> /tmp/dataconf
            echo "    ssl_session_cache shared:SSL:10m;" >> /tmp/dataconf
            echo "    ssl_session_timeout 10m;" >> /tmp/dataconf
            echo "    keepalive_timeout 65;" >> /tmp/dataconf
            echo "    keepalive_requests 200;" >> /tmp/dataconf

            echo '    gzip on;' >> /tmp/dataconf
            echo '    gzip_types text/plain text/css application/json application/javascript image/svg+xml;' >> /tmp/dataconf
            echo '    gzip_min_length 500;' >> /tmp/dataconf
            echo '    gzip_comp_level 4;' >> /tmp/dataconf
            echo '    gzip_proxied any;' >> /tmp/dataconf
            echo '    gzip_vary on;' >> /tmp/dataconf
            echo "    location /.well-known/acme-challenge/ {" >> /tmp/dataconf
            echo "        root /var/www/html;" >> /tmp/dataconf
            echo "    }" >> /tmp/dataconf
            echo "    location / {" >> /tmp/dataconf
            echo '        try_files $uri /_h5ai/public/index.php?$args;' >> /tmp/dataconf
            echo "    }" >> /tmp/dataconf
            if $PHP_AVAIL; then
              echo "    location ~ \\.php$ {" >> /tmp/dataconf
              echo "        fastcgi_pass unix:$PHP_SOCK;" >> /tmp/dataconf
              echo "        fastcgi_index index.php;" >> /tmp/dataconf
              echo "        include fastcgi_params;" >> /tmp/dataconf
              echo '        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;' >> /tmp/dataconf
              echo "        fastcgi_buffer_size 128k;" >> /tmp/dataconf
              echo "        fastcgi_buffers 256 16k;" >> /tmp/dataconf
              echo "        fastcgi_busy_buffers_size 256k;" >> /tmp/dataconf
              echo "        fastcgi_cache H5AI_CACHE;" >> /tmp/dataconf
              echo '        fastcgi_cache_key "$scheme$request_method$host$request_uri";' >> /tmp/dataconf
              echo "        fastcgi_cache_valid 200 5m;" >> /tmp/dataconf
              echo "        fastcgi_cache_use_stale updating error timeout invalid_header;" >> /tmp/dataconf
              echo "        fastcgi_cache_lock on;" >> /tmp/dataconf
              echo '        add_header X-FastCGI-Cache $upstream_cache_status;' >> /tmp/dataconf
              echo "    }" >> /tmp/dataconf
            fi
            echo "    location ~* \\.(css|js|png|jpg|jpeg|gif|ico|svg|woff2?|ttf|eot)$ {" >> /tmp/dataconf
            echo '        expires 30d;' >> /tmp/dataconf
            echo '        add_header Cache-Control "public, immutable";' >> /tmp/dataconf
            echo "    }" >> /tmp/dataconf
            echo "}" >> /tmp/dataconf
            cat /tmp/dataconf
            echo "--- copying config ---"
            printf '%s\n' "$SUDO_PASSWORD" | sudo -S -p '' cp /tmp/dataconf "$CONF" && echo "Config copied OK" || echo "Config copy FAILED"
            echo "=== testing nginx ==="
            printf '%s\n' "$SUDO_PASSWORD" | sudo -S -p '' nginx -t && printf '%s\n' "$SUDO_PASSWORD" | sudo -S -p '' systemctl reload nginx && echo "nginx OK" || echo "nginx FAILED"
            echo "=== data.speed4you.net setup complete ==="

      - name: Configure speed4you.net nginx HTTP/2 & gzip
        uses: appleboy/ssh-action@v1.2.0
        env:
          SUDO_PASSWORD: ${{ ***REMOVED***s.SUDO_PASSWORD }}
        with:
          host: ${{ ***REMOVED***s.DEPLOY_HOST }}
          username: ${{ ***REMOVED***s.DEPLOY_USER }}
          key: ${{ ***REMOVED***s.DEPLOY_SSH_KEY }}
          port: ${{ ***REMOVED***s.DEPLOY_PORT }}
          envs: SUDO_PASSWORD
          script: |
            set -e
            CONF=/etc/nginx/sites-enabled/speed4you.net
            if [ -f "$CONF" ]; then
              if ! grep -q 'listen 443 ssl http2' "$CONF"; then
                if grep -q 'listen 443 ssl;' "$CONF"; then
                  printf '%s\n' "$SUDO_PASSWORD" | sudo -S -p '' sed -i 's/listen 443 ssl;/listen 443 ssl http2;/' "$CONF"
                  echo "HTTP/2 enabled"
                fi
              fi
              if ! grep -q 'gzip on;' "$CONF"; then
                printf '%s\n' "$SUDO_PASSWORD" | sudo -S -p '' sed -i '/^server {/a\    gzip on;\n    gzip_types text/plain text/css application/json application/javascript image/svg+xml;\n    gzip_min_length 1000;\n    gzip_vary on;' "$CONF"
                echo "gzip enabled"
              fi
              if grep -q 'alias /var/www/html/;' "$CONF"; then
                printf '%s\n' "$SUDO_PASSWORD" | sudo -S -p '' sed -i 's|alias /var/www/html/;|rewrite ^/media(/.*)$ $1 break;\n        root /var/www/html;|' "$CONF"
                echo "/media/ location fixed (alias -> rewrite+root)"
              elif ! grep -q 'location /media/' "$CONF"; then
                printf '%s\n' "$SUDO_PASSWORD" | sudo -S -p '' sed -i '/^    location \/ {/i\    location /media/ {\n        rewrite ^/media(/.*)$ $1 break;\n        root /var/www/html;\n        add_header Accept-Ranges bytes;\n        expires 7d;\n        add_header Cache-Control "public, immutable";\n    }\n' "$CONF"
                echo "/media/ location added"
              fi
              # Add rate limiting for /media/ downloads
              printf '%s\n' "$SUDO_PASSWORD" | sudo -S -p '' mkdir -p /etc/nginx/conf.d
              if ! grep -q 'media_download' /etc/nginx/conf.d/rate-limit.conf 2>/dev/null; then
                echo 'limit_conn_zone $binary_remote_addr zone=media_download:10m;' > /tmp/rate-limit.conf
                printf '%s\n' "$SUDO_PASSWORD" | sudo -S -p '' cp /tmp/rate-limit.conf /etc/nginx/conf.d/rate-limit.conf
                rm -f /tmp/rate-limit.conf
                echo "rate-limit.conf created"
              fi
              if ! grep -q 'limit_conn media_download' "$CONF"; then
                printf '%s\n' "$SUDO_PASSWORD" | sudo -S -p '' sed -i '/expires 7d;/a\        limit_conn media_download 5;' "$CONF"
                echo "limit_conn added to /media/ location"
              fi
              printf '%s\n' "$SUDO_PASSWORD" | sudo -S -p '' nginx -t
              printf '%s\n' "$SUDO_PASSWORD" | sudo -S -p '' systemctl reload nginx
              echo "speed4you.net nginx reloaded"
            fi

      - name: Verify deployed frontend bundle
        env:
          EXPECTED_BUNDLE: ${{ steps.frontend_bundle.outputs.bundle }}
        run: |
          set -e
          echo "Expected bundle: '$EXPECTED_BUNDLE'"
          LIVE_BUNDLE=$(curl -fsS "https://speed4you.net/" | grep -oE 'index-[a-z0-9]+\.js' | head -1)
          echo "Live site bundle: '$LIVE_BUNDLE'"

          if [ "$LIVE_BUNDLE" != "$EXPECTED_BUNDLE" ]; then
            echo "FAIL: live site references '$LIVE_BUNDLE', expected '$EXPECTED_BUNDLE'" >&2
            exit 1
          fi

          if ! curl -fsS -o /dev/null "https://speed4you.net/assets/$LIVE_BUNDLE"; then
            echo "FAIL: https://speed4you.net/assets/$LIVE_BUNDLE not reachable" >&2
            exit 1
          fi
          echo "OK — $LIVE_BUNDLE verified via HTTPS"

      - name: Deployment summary
        run: |
          echo "Deployment completed."
          echo "Site : https://speed4you.net/"
          echo "API  : https://speed4you.net/portal-api/api/content/latest?limit=3"
