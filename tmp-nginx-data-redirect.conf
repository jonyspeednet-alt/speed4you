server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name data.speed4you.net;

    ssl_certificate /etc/letsencrypt/live/data.speed4you.net/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/data.speed4you.net/privkey.pem;

    location /portal/ {
        return 301 https://speed4you.net/;
    }

    location /portal-api/ {
        proxy_pass http://127.0.0.1:4100/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        return 301 https://speed4you.net/;
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name data.speed4you.net;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/html;
        allow all;
        autoindex off;
    }

    location / {
        return 301 https://speed4you.net/;
    }
}
